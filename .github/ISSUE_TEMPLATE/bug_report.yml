name: Bug report
description: Wrong output, a crash, or behavior that contradicts the documentation.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected and what you observed instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: A minimal program or input that shows the problem. Include the key type, record type and input length.
      render: rust
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Tessera version or commit
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: Output of `rustc -vV`, the target, and any RUSTFLAGS.
      render: text
    validations:
      required: true
  - type: dropdown
    id: ai
    attributes:
      label: AI assistance
      description: Was this report found or written with AI tools?
      options:
        - "No"
        - "Yes, and I verified the reproduction myself"
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I ran the reproduction myself on the version above.
          required: true

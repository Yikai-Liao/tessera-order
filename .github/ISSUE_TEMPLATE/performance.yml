name: Performance report
description: A workload where Tessera is slower than expected, or results from another machine.
labels: [performance]
body:
  - type: textarea
    id: workload
    attributes:
      label: Workload
      description: Key and record types, input length, distribution, and how often you sort.
    validations:
      required: true
  - type: textarea
    id: results
    attributes:
      label: Measurements
      description: Times for Tessera and the alternatives you compared, and how you measured them.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Tessera version or commit
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: CPU model, OS, `rustc -vV`, RUSTFLAGS and LTO settings.
      render: text
    validations:
      required: true
  - type: dropdown
    id: ai
    attributes:
      label: AI assistance
      description: Was this report found or written with AI tools?
      options:
        - "No"
        - "Yes, and I verified the measurements myself"
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I ran these measurements myself on the version above.
          required: true

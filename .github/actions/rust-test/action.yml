# SPDX-License-Identifier: BSD-2-Clause
name: Rust test cell
description: >-
  Build and test the workspace with one toolchain. The pull request cells and
  the main-only cells both call this action, so the command list has one home.

inputs:
  toolchain:
    description: Toolchain to install and test with, either "stable" or the MSRV.
    required: true

runs:
  using: composite
  steps:
    # Lints are enforced on stable only: older compilers report false positives,
    # such as `unreachable_pub` on 1.85, so the MSRV only has to build and pass
    # the tests.
    - name: Set RUSTFLAGS
      shell: bash
      env:
        FLAGS: ${{ inputs.toolchain == 'stable' && '-D warnings' || '' }}
      run: echo "RUSTFLAGS=$FLAGS" >> "$GITHUB_ENV"
    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ inputs.toolchain }}
    - uses: Swatinem/rust-cache@v2
    # The standalone registry needs only layout.h and C++17, not fetched native
    # competitors. Compile it on existing cells to check portable macro expansion.
    - name: Compile native registry with GCC and Clang
      if: inputs.toolchain == 'stable' && runner.os == 'Linux'
      shell: bash
      run: |
        for compiler in g++ clang++; do
          "$compiler" -std=c++17 -pedantic-errors -Wall -Wextra -Werror \
            -c bench/rust/native/registry.cpp -o "$RUNNER_TEMP/registry.o"
        done
    - name: Compile native registry with both MSVC preprocessors
      if: inputs.toolchain == 'stable' && runner.os == 'Windows'
      shell: pwsh
      run: |
        $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        $installation = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
        if (!$installation) { throw "MSVC installation not found" }
        $setup = Join-Path $installation "Common7\Tools\VsDevCmd.bat"
        foreach ($preprocessor in @("/Zc:preprocessor", "/Zc:preprocessor-")) {
          cmd /c "call `"$setup`" -arch=x64 -host_arch=x64 && cl /nologo /std:c++17 /permissive- /W4 /WX $preprocessor /c bench\rust\native\registry.cpp /Fo`"$env:RUNNER_TEMP\registry.obj`""
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        }
    # `--lib --tests` rather than `--all-targets`: the only extra target is the
    # Criterion benchmark, which no test asserts on and which bench-build.yml
    # compiles on the stable Linux runner for every change that touches Rust.
    - shell: bash
      run: cargo test --workspace --lib --tests
    # Benchmark dependencies would otherwise enable the crate's std feature.
    - shell: bash
      run: cargo test -p tessera-sort --lib --tests --no-default-features
    - shell: bash
      run: cargo test --workspace --doc
    # Rayon keeps the crate's 1.85 MSRV. Exercise its public entry points on
    # every platform, also when the implementation takes the serial fallback.
    - shell: bash
      run: cargo test -p tessera-sort --lib --tests --features rayon
    - shell: bash
      run: cargo test -p tessera-sort --doc --features rayon
    # Portable SIMD needs Rust 1.89, so only stable compiles it. The backend is
    # chosen by ISA, not by operating system, so on main the x86-64 and AArch64
    # Linux runners already interpret what macOS and Windows would repeat; those
    # platforms only have to compile the feature, which is the part a platform
    # change can break. Select library features explicitly: workspace-wide
    # --all-features also enables tessera-bench/compare-native, which requires
    # the fetched sources and Linux x86-64 toolchain of the comparison job.
    - shell: bash
      if: inputs.toolchain == 'stable' && runner.os == 'Linux'
      run: cargo test --workspace --lib --tests --features tessera-sort/portable-simd,tessera-sort/rayon
    - shell: bash
      if: inputs.toolchain == 'stable' && runner.os == 'Linux'
      run: cargo test --workspace --doc --features tessera-sort/portable-simd,tessera-sort/rayon
    - shell: bash
      if: inputs.toolchain == 'stable' && runner.os != 'Linux'
      run: cargo build --workspace --lib --features tessera-sort/portable-simd,tessera-sort/rayon

# SPDX-License-Identifier: BSD-2-Clause

name: Measure benchmarks
# Retain the triggering target SHA even if a stacked parent is rewritten later.
run-name: paired-v2 pr=${{ github.event.pull_request.number || '0' }} base=${{ github.event.pull_request.base.sha || 'parent' }} head=${{ github.event.pull_request.head.sha || github.sha }}

# Unprivileged: PR code runs only here, without Cloud credentials or write access.
on:
  pull_request:
    paths:
      - "rust/**"
      - "bench/**"
      - "tools/**"
      - "!rust/**/*.md"
      - "!bench/**/*.md"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain*"
      - ".cargo/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/bench-*.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Cancel obsolete PR heads, but never replace a pending main comparison.
  group: bench-measure-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TESSERA_BENCH_TARGET_DIR: ${{ github.workspace }}/target/continuous
      RUSTFLAGS: -C llvm-args=-align-loops=64 -C llvm-args=-align-all-nofallthru-blocks=6
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target/continuous"
          shared-key: continuous-portable-simd
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - id: matrix
        run: echo "value=$(pnpm -s tools continuous matrix)" >> "$GITHUB_OUTPUT"
      - name: Build both revisions once
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$PR_BASE" ]; then
            baseline=$(git merge-base "$PR_BASE" HEAD)
          else
            baseline=$(git rev-parse HEAD^)
          fi
          pnpm tools compare commit "$baseline" --plan continuous --prepare-only \
            --out bench/results/prepared
      - uses: actions/upload-artifact@v7
        with:
          name: prepared-revisions
          path: bench/results/prepared/
          retention-days: 14
          if-no-files-found: error

  measure:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@v8
        with:
          name: prepared-revisions
          path: bench/results/prepared
      - name: Measure retained revisions without compiling
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          pnpm tools compare prepared bench/results/prepared --shard "$SHARD" \
            --out bench/results/continuous
      - name: Retain measurement log
        if: always()
        run: |
          if [ -f bench/results/continuous.log ]; then
            mkdir -p bench/results/continuous
            cp bench/results/continuous.log bench/results/continuous/measurement.log
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ matrix.artifact }}
          path: bench/results/continuous/
          retention-days: 14
          if-no-files-found: warn

name: Build benchmarks

# Unprivileged: runs PR code, including forks, without secrets. The tracker
# packages these artifacts without executing them on a credentialed runner.
on:
  pull_request:
    paths:
      - "rust/**"
      - "bench/rust/**"
      - "!rust/**/*.md"
      - "!bench/rust/**/*.md"
      - "bench/catalog.toml"
      - "bench/catalog.ts"
      - "bench/plans/continuous.toml"
      - "bench/workspace.ts"
      - "bench/continuous/runner.ts"
      - "bench/continuous/worker.ts"
      - "bench/continuous/Dockerfile"
      - "tools/index.ts"
      - "tools/continuous.ts"
      - "tools/process.ts"
      - "tools/tasks.ts"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "rust-toolchain"
      - ".cargo/**"
      - ".github/workflows/bench-build.yml"
      - ".github/workflows/bench-track.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bench-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # One runner builds both configurations, sharing one isolated target.
      - run: pnpm tools continuous build --out out
      - uses: actions/upload-artifact@v7
        with:
          name: bench-rust-default
          path: out/default/bench
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: bench-rust
          path: out/portable-simd/bench
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: benchmark-build-log
          path: out.log
          if-no-files-found: ignore

# SPDX-License-Identifier: BSD-2-Clause
name: Benchmark diagnostics
on: workflow_dispatch
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      TESSERA_BENCH_TARGET_DIR: ${{ github.workspace }}/target/benchmark
      CARGO_BUILD_TARGET: x86_64-unknown-linux-gnu
      CARGO_PROFILE_BENCH_DEBUG: "0"
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target/benchmark"
          shared-key: benchmark-static-${{ hashFiles('Cargo.toml', 'bench/workspace.ts') }}
          save-if: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: |
          git restore --source=ace911a9 -- rust/tessera-order
          bun run tools continuous prepare ddb2f6d9 --out bench/results/replay
      - uses: actions/upload-artifact@v7
        with:
          name: replay-pair
          path: bench/results/replay
  replay:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    strategy:
      matrix:
        order: [forward, reverse, interleaved]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@v8
        with:
          name: replay-pair
          path: replay
      - run: |
          cd replay
          chmod +x binaries/*/worker
          jq '.plan' prepared.json > plan.json
          git show 99061eeb:bench/local/samples.ts > ../bench/local/replay-old.ts
          mkdir output
          lscpu > output/host.txt
          cpu=$(awk '/^Cpus_allowed_list:/ {print $2}' /proc/self/status | cut -d, -f1 | cut -d- -f1)
          case '${{ matrix.order }}' in
            forward) groups='old-aa new-aa old-ab new-ab';;
            reverse) groups='new-ab old-ab new-aa old-aa';;
            interleaved) groups='new-aa old-ab new-ab old-aa';;
          esac
          for group in $groups; do
            TESSERA_REPLAY_CORPUS=${group%%-*} bun ../bench/local/replay.ts "$group" "$cpu" > "output/$group.json"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: replay-${{ matrix.order }}
          path: replay/output

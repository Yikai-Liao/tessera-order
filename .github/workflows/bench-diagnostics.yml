# SPDX-License-Identifier: BSD-2-Clause
name: Benchmark diagnostics
on: workflow_dispatch
permissions:
  contents: read
  actions: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    strategy:
      matrix:
        order: [forward, reverse, interleaved]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: 44862687879
          artifact-ids: 14690970523
          merge-multiple: true
          path: replay
      - run: |
          cd replay
          sha256sum -c <<'HASHES'
          2740880e531489af9bf63cad3577b2a572c0fd92b683c849afc164802d9e8419  binaries/baseline-default/worker
          5a63f97425a93592cfc572f47a9ed7d540444b6faf41906a9765e88a53c382ff  binaries/current-default/worker
          HASHES
          chmod +x binaries/*/worker
          jq '.plan' prepared.json > plan.json
          git show 99061eeb:bench/local/samples.ts > ../bench/local/replay-old.ts
          mkdir output
          lscpu > output/host.txt
          cpu=$(awk '/^Cpus_allowed_list:/ {print $2}' /proc/self/status | cut -d, -f1 | cut -d- -f1)
          case '${{ matrix.order }}' in
            forward) groups='old-aa new-aa old-ab new-ab';;
            reverse) groups='new-ab old-ab new-aa old-aa';;
            interleaved) groups='new-aa old-ab new-ab old-aa';;
          esac
          for group in $groups; do
            bun ../bench/local/replay.ts "$group" "$cpu" > "output/$group.json"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: replay-${{ matrix.order }}
          path: replay/output

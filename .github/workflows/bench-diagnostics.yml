# SPDX-License-Identifier: BSD-2-Clause

name: Benchmark diagnostics

# Unprivileged evidence only: no Bencher credentials, submissions or thresholds.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Evidence to collect
        type: choice
        options: [counters, layout]
        default: counters
      baseline:
        description: Baseline commit (empty uses the selected head)
        type: string

permissions:
  contents: read

concurrency:
  group: bench-diagnostics-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: sudo apt-get update -qq && sudo apt-get install -y valgrind lld
      # Keep results and logs ignored so provenance describes the source checkout.
      - name: Fixed-work attribution signals
        if: inputs.mode == 'counters'
        env:
          BASELINE: ${{ inputs.baseline || github.event.pull_request.base.sha || github.sha }}
        run: >-
          bun run tools compare counters "$BASELINE"
          --plan bench/plans/diagnostics.toml
          --sorts 8 --out bench/results/diagnostics/counters
      - name: Placement sample (shared runner; exploratory)
        if: inputs.mode == 'layout'
        env:
          BASELINE: ${{ inputs.baseline || github.sha }}
        run: >-
          bun run tools compare commit "$BASELINE"
          --plan bench/plans/diagnostics.toml
          --layout-seeds 11,12,13,14,15 --out bench/results/diagnostics/layout
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: benchmark-diagnostics-${{ github.run_id }}
          path: bench/results/diagnostics
          retention-days: 14
          if-no-files-found: warn

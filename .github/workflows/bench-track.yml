name: Track benchmarks

# Privileged: runs trusted default-branch code after a build. It packages the
# untrusted executable without running it and submits it to Bencher.
on:
  workflow_run:
    workflows: [Build benchmarks]
    types: [completed]

permissions:
  contents: read

jobs:
  rust:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    environment: benchmark
    timeout-minutes: 30
    # Bencher Free runs one job per organization; queue rather than replace.
    concurrency:
      group: bencher-bare-metal
      queue: max
    permissions:
      # Only this trusted workflow publishes generated SVGs to benchmark-images.
      contents: write
      actions: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Never check out the triggering PR in this workflow.
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Resolve source commit and PR
        id: source
        uses: actions/github-script@v9
        with:
          script: |
            const { resolveSource } = require('./.github/scripts/bencher/github.ts');
            await resolveSource({ github, context, core });
      - name: Start the report checks
        id: check
        if: steps.source.outputs.eligible == 'true'
        uses: actions/github-script@v9
        env:
          HASH: ${{ steps.source.outputs.hash }}
        with:
          script: |
            const { startReport } = require('./.github/scripts/bencher/github.ts');
            const { VARIANTS } = require('./.github/scripts/bencher/variants.ts');
            for (const variant of VARIANTS) {
              await startReport({ github, context, core, hash: process.env.HASH, variant });
            }
            core.setOutput('variants', JSON.stringify(VARIANTS));
      - uses: actions/download-artifact@v8
        if: steps.source.outputs.eligible == 'true'
        with:
          name: bench-rust-default
          path: artifact/default
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - uses: actions/download-artifact@v8
        if: steps.source.outputs.eligible == 'true'
        with:
          name: bench-rust
          path: artifact/portable-simd
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Package and push image
        if: steps.source.outputs.eligible == 'true'
        id: image
        env:
          BENCHER_PROJECT: ${{ vars.BENCHER_PROJECT }}
          BENCHER_API_KEY: ${{ secrets.BENCHER_API_KEY }}
          TAG: rust-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
        run: |
          # The image definition is trusted; only the executable comes from the build.
          image="registry.bencher.dev/$BENCHER_PROJECT:$TAG"
          chmod +x artifact/default/bench artifact/portable-simd/bench
          printf 'FROM scratch\nCOPY default/bench /bench-default\nCOPY portable-simd/bench /bench-portable-simd\n' \
            | docker build --platform linux/amd64 -t "$image" -f - artifact
          printf '%s' "$BENCHER_API_KEY" | docker login registry.bencher.dev \
            --username "$BENCHER_PROJECT" --password-stdin
          docker push "$image"
          # Submit immutable content, not a tag.
          echo "reference=$(docker inspect --format '{{index .RepoDigests 0}}' "$image")" >> "$GITHUB_OUTPUT"
          docker logout registry.bencher.dev
      - uses: bencherdev/bencher@7de3c69a85380826613050826b4bce062be2f07d # v0.6.16
        if: steps.source.outputs.eligible == 'true'
        with:
          version: 0.6.16
      - name: Measure on Bencher Bare Metal
        id: measure
        if: steps.source.outputs.eligible == 'true'
        env:
          BENCHER_PROJECT: ${{ vars.BENCHER_PROJECT }}
          BENCHER_API_KEY: ${{ secrets.BENCHER_API_KEY }}
          BRANCH: ${{ steps.source.outputs.branch }}
          HASH: ${{ steps.source.outputs.hash }}
          BASE: ${{ steps.source.outputs.base }}
          START_POINT: ${{ steps.source.outputs.start_point }}
          BASE_HASH: ${{ steps.source.outputs.base_hash }}
          PR_NUMBER: ${{ steps.source.outputs.number }}
          IMAGE: ${{ steps.image.outputs.reference }}
          VARIANTS_JSON: ${{ steps.check.outputs.variants }}
        run: |
          if [ -n "$START_POINT" ]; then
            # Compare against the parent PR's samples at this PR's base commit.
            # A stacked PR's base branch is a GitHub branch name, which Bencher
            # never stores; the parent's `pr-<number>` is the Bencher branch.
            args=(--start-point "$START_POINT" --start-point-hash "$BASE_HASH"
              --start-point-clone-thresholds --start-point-reset)
          elif [ -n "$PR_NUMBER" ]; then
            # The tracker could not name a start point. Measure anyway; the
            # report fails the check with the reason instead of passing
            # without a comparison.
            args=()
          else
            # Five percent around the previous main sample. A statistical test
            # over a window of main samples mixes code from before and after
            # each optimization, so its limits widen into the next one
            # (decision 0029).
            args=(--threshold-measure latency --threshold-test percentage
              --threshold-min-sample-size 1 --threshold-max-sample-size 1
              --threshold-upper-boundary 0.05 --threshold-lower-boundary 0.05
              --thresholds-reset)
          fi
          # Each configuration gets its own remote job and timeout. A failed
          # measurement must not prevent measuring the other configuration.
          while IFS=$'\t' read -r variant testbed; do
            if bencher run --project "$BENCHER_PROJECT" --key "$BENCHER_API_KEY" \
              --branch "$BRANCH" --hash "$HASH" \
              --testbed "$testbed" --spec intel-v1 \
              --image "$IMAGE" --job-timeout 240 \
              --adapter rust_criterion --format json --quiet \
              "${args[@]}" --exec -- "/bench-$variant" --bench > "$RUNNER_TEMP/bencher-$variant.json"; then
              echo "$variant=success" >> "$GITHUB_OUTPUT"
            else
              echo "$variant=failure" >> "$GITHUB_OUTPUT"
            fi
          done < <(jq -r '.[] | [.id, .testbed] | @tsv' <<< "$VARIANTS_JSON")
      - name: Publish report
        if: always() && (steps.check.outputs.default || steps.check.outputs['portable-simd'])
        uses: actions/github-script@v9
        env:
          HASH: ${{ steps.source.outputs.hash }}
          PR_NUMBER: ${{ steps.source.outputs.number }}
          BASE: ${{ steps.source.outputs.base }}
          START_POINT: ${{ steps.source.outputs.start_point }}
          BASE_HASH: ${{ steps.source.outputs.base_hash }}
          BASELINE_REASON: ${{ steps.source.outputs.baseline_reason }}
          CHECK_DEFAULT: ${{ steps.check.outputs.default }}
          CHECK_SIMD: ${{ steps.check.outputs['portable-simd'] }}
          OUTCOME_DEFAULT: ${{ steps.measure.outputs.default }}
          OUTCOME_SIMD: ${{ steps.measure.outputs['portable-simd'] }}
          CANCELLED: ${{ job.status == 'cancelled' }}
        with:
          script: |
            const { publishReport } = require('./.github/scripts/bencher/index.ts');
            const { VARIANTS } = require('./.github/scripts/bencher/variants.ts');
            const env = process.env;
            await publishReport({ github, context, core, inputs: {
              language: "rust", hash: env.HASH, number: env.PR_NUMBER,
              baseRef: env.BASE || "main",
              startPoint: env.START_POINT, baseHash: env.BASE_HASH,
              baselineReason: env.BASELINE_REASON,
              variants: VARIANTS.map(variant => ({
                variant,
                checkId: variant.id === 'default' ? env.CHECK_DEFAULT : env.CHECK_SIMD,
                outcome: (variant.id === 'default' ? env.OUTCOME_DEFAULT : env.OUTCOME_SIMD)
                  || (env.CANCELLED === 'true' ? 'cancelled' : 'failure'),
                reportPath: `${env.RUNNER_TEMP}/bencher-${variant.id}.json`,
              })),
            } });

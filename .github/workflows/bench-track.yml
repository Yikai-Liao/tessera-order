name: Track benchmarks

# Trusted default-branch code reads JSON artifacts; it never runs measured code.
on:
  workflow_run:
    workflows: [Measure benchmarks]
    types: [completed]

permissions:
  contents: read

jobs:
  publish:
    if: github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-24.04
    environment: benchmark
    timeout-minutes: 15
    # Only the short publication phase serializes image-branch writes.
    concurrency:
      group: benchmark-publication
      # GitHub queues up to 100 publishers instead of replacing pending writes.
      queue: max
    permissions:
      contents: write
      actions: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Resolve measured source independently
        id: source
        uses: actions/github-script@v9
        with:
          script: |
            const { resolveSource } = require('./bench/continuous/github.ts');
            await resolveSource({ github, context, core });
      - uses: dtolnay/rust-toolchain@stable
        if: steps.source.outputs.eligible == 'true'
      - name: Resolve trusted case inventory without measurements
        if: steps.source.outputs.eligible == 'true'
        run: pnpm tools continuous inventory --out "$RUNNER_TEMP/inventory"
      - uses: actions/download-artifact@v8
        if: steps.source.outputs.eligible == 'true'
        continue-on-error: true
        with:
          pattern: paired-*
          path: ${{ runner.temp }}/paired
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - uses: bencherdev/bencher@7de3c69a85380826613050826b4bce062be2f07d # v0.6.16
        if: steps.source.outputs.eligible == 'true'
        with:
          version: 0.6.16
      - name: Upload paired JSON to Bencher Cloud
        id: upload
        if: steps.source.outputs.eligible == 'true'
        continue-on-error: true
        env:
          BENCHER_API_KEY: ${{ secrets.BENCHER_API_KEY }}
          BENCHER_PROJECT: ${{ vars.BENCHER_PROJECT }}
          HASH: ${{ steps.source.outputs.hash }}
          BASE_HASH: ${{ steps.source.outputs.base_hash }}
          PR_NUMBER: ${{ steps.source.outputs.number }}
        run: |
          args=()
          if [ -n "$PR_NUMBER" ]; then args+=(--pr "$PR_NUMBER"); fi
          pnpm tools continuous submit --project "$BENCHER_PROJECT" \
            --hash "$HASH" --base-hash "$BASE_HASH" \
            --inventory "$RUNNER_TEMP/inventory/cases.json" \
            --artifacts "$RUNNER_TEMP/paired" --out "$RUNNER_TEMP/submission" "${args[@]}"
      - name: Publish paired checks and PR report
        if: always() && steps.source.outputs.eligible == 'true'
        uses: actions/github-script@v9
        env:
          HASH: ${{ steps.source.outputs.hash }}
          BASE_HASH: ${{ steps.source.outputs.base_hash }}
          PR_NUMBER: ${{ steps.source.outputs.number }}
          BASE: ${{ steps.source.outputs.base }}
        with:
          script: |
            const { publishReport } = require('./bench/continuous/index.ts');
            const path = require('node:path');
            await publishReport({ github, context, core, inputs: {
              hash: process.env.HASH, baseHash: process.env.BASE_HASH,
              number: process.env.PR_NUMBER, baseRef: process.env.BASE || 'main',
              artifacts: path.join(process.env.RUNNER_TEMP, 'paired'),
              inventory: path.join(process.env.RUNNER_TEMP, 'inventory/cases.json'),
              reports: path.join(process.env.RUNNER_TEMP, 'submission'),
            } });
      - uses: actions/upload-artifact@v7
        if: always() && steps.source.outputs.eligible == 'true'
        with:
          name: continuous-submission
          path: |
            ${{ runner.temp }}/submission/
            ${{ runner.temp }}/submission.log
          if-no-files-found: ignore
      - name: Preserve upload failure
        if: always() && steps.upload.outcome == 'failure'
        run: exit 1

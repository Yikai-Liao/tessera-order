name: Track benchmarks
run-name: Track benchmarks · ${{ github.event.workflow_run.head_sha }}

# Privileged: runs trusted default-branch code after a build. It packages the
# untrusted executable without running it and submits it to Bencher.
on:
  workflow_run:
    workflows: [Build benchmarks]
    types: [completed]

permissions:
  contents: read

jobs:
  queue:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      checks: write
      pull-requests: write
    outputs:
      eligible: ${{ steps.source.outputs.eligible }}
      hash: ${{ steps.source.outputs.hash }}
      number: ${{ steps.source.outputs.number }}
      check_default: ${{ steps.check.outputs.default }}
      check_simd: ${{ steps.check.outputs['portable-simd'] }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Resolve source commit and PR
        id: source
        uses: actions/github-script@v9
        with:
          script: |
            const { resolveSource } = require('./bench/continuous/github.ts');
            await resolveSource({ github, context, core });
      - uses: pnpm/action-setup@v4
        if: steps.source.outputs.eligible == 'true'
      - uses: actions/setup-node@v7
        if: steps.source.outputs.eligible == 'true'
        with:
          node-version: 24
          cache: pnpm
      - name: Install trusted report dependencies
        if: steps.source.outputs.eligible == 'true'
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Queue the report checks
        id: check
        if: steps.source.outputs.eligible == 'true'
        uses: actions/github-script@v9
        env:
          HASH: ${{ steps.source.outputs.hash }}
        with:
          script: |
            const { queueReport } = require('./bench/continuous/lifecycle.ts');
            const { VARIANTS } = require('./bench/catalog.ts');
            for (const variant of VARIANTS) {
              core.setOutput(variant.id, await queueReport({ github, context, hash: process.env.HASH, variant }));
            }
      - name: Publish queued feedback
        if: steps.source.outputs.eligible == 'true'
        uses: actions/github-script@v9
        env:
          HASH: ${{ steps.source.outputs.hash }}
          PR_NUMBER: ${{ steps.source.outputs.number }}
        with:
          script: |
            const { publishProgress } = require('./bench/continuous/lifecycle.ts');
            await publishProgress({ github, context, core, hash: process.env.HASH,
              number: process.env.PR_NUMBER, state: 'queued' });

  rust:
    needs: queue
    if: needs.queue.outputs.eligible == 'true'
    runs-on: ubuntu-24.04
    environment: benchmark
    timeout-minutes: 30
    # Only measurement holds the shared slot; queue feedback is already visible.
    concurrency:
      group: bencher-bare-metal
      queue: max
    permissions:
      contents: write
      actions: read
      checks: write
      pull-requests: write
    outputs:
      eligible: ${{ steps.source.outputs.eligible }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Never check out the triggering PR in this workflow.
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Revalidate source after waiting
        id: source
        uses: actions/github-script@v9
        with:
          script: |
            const { resolveSource } = require('./bench/continuous/github.ts');
            await resolveSource({ github, context, core });
      - uses: pnpm/action-setup@v4
        if: steps.source.outputs.eligible == 'true'
      - uses: actions/setup-node@v7
        if: steps.source.outputs.eligible == 'true'
        with:
          node-version: 24
          cache: pnpm
      - name: Install trusted report dependencies
        if: steps.source.outputs.eligible == 'true'
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Activate the report checks
        id: check
        if: steps.source.outputs.eligible == 'true'
        uses: actions/github-script@v9
        env:
          HASH: ${{ steps.source.outputs.hash }}
          CHECK_DEFAULT: ${{ needs.queue.outputs.check_default }}
          CHECK_SIMD: ${{ needs.queue.outputs.check_simd }}
          PR_NUMBER: ${{ steps.source.outputs.number }}
        with:
          script: |
            const { activateReport, publishProgress } = require('./bench/continuous/lifecycle.ts');
            const { VARIANTS } = require('./bench/catalog.ts');
            const ids = { default: process.env.CHECK_DEFAULT, 'portable-simd': process.env.CHECK_SIMD };
            for (const variant of VARIANTS) {
              core.setOutput(variant.id, await activateReport({ github, context, hash: process.env.HASH,
                variant, checkId: ids[variant.id] }));
            }
            await publishProgress({ github, context, core, hash: process.env.HASH,
              number: process.env.PR_NUMBER, state: 'running' });
      - uses: actions/download-artifact@v8
        if: steps.source.outputs.eligible == 'true'
        with:
          name: bench-rust-default
          path: artifact/default
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - uses: actions/download-artifact@v8
        if: steps.source.outputs.eligible == 'true'
        with:
          name: bench-rust
          path: artifact/portable-simd
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Package and push image
        if: steps.source.outputs.eligible == 'true'
        id: image
        env:
          BENCHER_PROJECT: ${{ vars.BENCHER_PROJECT }}
          BENCHER_API_KEY: ${{ secrets.BENCHER_API_KEY }}
          TAG: rust-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
        run: |
          # The image definition is trusted; only the executable comes from the build.
          image="registry.bencher.dev/$BENCHER_PROJECT:$TAG"
          chmod +x artifact/default/bench artifact/portable-simd/bench
          mkdir -p artifact/bench/continuous artifact/tools
          cp bench/continuous/worker.ts artifact/bench/continuous/
          cp tools/process.ts artifact/tools/
          docker build --platform linux/amd64 -t "$image" -f bench/continuous/Dockerfile artifact
          printf '%s' "$BENCHER_API_KEY" | docker login registry.bencher.dev \
            --username "$BENCHER_PROJECT" --password-stdin
          docker push "$image"
          # Submit immutable content, not a tag.
          echo "reference=$(docker inspect --format '{{index .RepoDigests 0}}' "$image")" >> "$GITHUB_OUTPUT"
          docker logout registry.bencher.dev
      - uses: bencherdev/bencher@7de3c69a85380826613050826b4bce062be2f07d # v0.6.16
        if: steps.source.outputs.eligible == 'true'
        with:
          version: 0.6.16
      - name: Measure on Bencher Bare Metal
        id: measure
        if: steps.source.outputs.eligible == 'true'
        # Publication reads per-build outcomes even if one remote measurement fails.
        continue-on-error: true
        env:
          BENCHER_PROJECT: ${{ vars.BENCHER_PROJECT }}
          BENCHER_API_KEY: ${{ secrets.BENCHER_API_KEY }}
          HASH: ${{ steps.source.outputs.hash }}
          START_POINT: ${{ steps.source.outputs.start_point }}
          BASE_HASH: ${{ steps.source.outputs.base_hash }}
          PR_NUMBER: ${{ steps.source.outputs.number }}
          IMAGE: ${{ steps.image.outputs.reference }}
        run: |
          args=()
          if [ -n "$PR_NUMBER" ]; then args+=(--pr "$PR_NUMBER"); fi
          if [ -n "$START_POINT" ]; then
            args+=(--start-point "$START_POINT" --base-hash "$BASE_HASH")
          fi
          pnpm --silent tools continuous submit --project "$BENCHER_PROJECT" \
            --image "$IMAGE" --hash "$HASH" --out "$RUNNER_TEMP/measurement" "${args[@]}"
      - name: Publish report
        if: always() && steps.check.outputs.default && steps.check.outputs['portable-simd']
        uses: actions/github-script@v9
        env:
          HASH: ${{ steps.source.outputs.hash }}
          PR_NUMBER: ${{ steps.source.outputs.number }}
          BASE: ${{ steps.source.outputs.base }}
          START_POINT: ${{ steps.source.outputs.start_point }}
          BASE_HASH: ${{ steps.source.outputs.base_hash }}
          BASELINE_REASON: ${{ steps.source.outputs.baseline_reason }}
          CHECK_DEFAULT: ${{ steps.check.outputs.default }}
          CHECK_SIMD: ${{ steps.check.outputs['portable-simd'] }}
          REPORT_DIR: ${{ runner.temp }}/measurement
          CANCELLED: ${{ job.status == 'cancelled' }}
        with:
          script: |
            const { publishReport } = require('./bench/continuous/index.ts');
            const { VARIANTS } = require('./bench/catalog.ts');
            const env = process.env;
            let outcomes = {};
            try {
              outcomes = JSON.parse(require('node:fs').readFileSync(env.REPORT_DIR + '/outcomes.json', 'utf8'));
            } catch {
              core.notice('No remote outcome file; unfinished measurements will fail their checks.');
            }
            await publishReport({ github, context, core, inputs: {
              language: "rust", hash: env.HASH, number: env.PR_NUMBER,
              baseRef: env.BASE || "main",
              startPoint: env.START_POINT, baseHash: env.BASE_HASH,
              baselineReason: env.BASELINE_REASON,
              variants: VARIANTS.map(variant => ({
                variant,
                checkId: variant.id === 'default' ? env.CHECK_DEFAULT : env.CHECK_SIMD,
                outcome: outcomes[variant.id] || (env.CANCELLED === 'true' ? 'cancelled' : 'failure'),
                reportPath: `${env.REPORT_DIR}/bencher-${variant.id}.json`,
              })),
            } });
      - uses: actions/upload-artifact@v7
        if: always() && steps.source.outputs.eligible == 'true'
        with:
          name: continuous-measurement
          path: |
            ${{ runner.temp }}/measurement/
            ${{ runner.temp }}/measurement.log
          if-no-files-found: ignore

  finalize:
    needs: [queue, rust]
    if: always() && (needs.queue.outputs.eligible == 'true' || needs.queue.result == 'failure' || needs.queue.result == 'cancelled')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Close unfinished tracking checks
        uses: actions/github-script@v9
        env:
          HASH: ${{ needs.queue.outputs.hash || github.event.workflow_run.head_sha }}
          PR_NUMBER: ${{ needs.queue.outputs.number }}
          QUEUE_RESULT: ${{ needs.queue.result }}
          MEASURE_RESULT: ${{ needs.rust.result }}
          ELIGIBLE: ${{ needs.rust.outputs.eligible }}
        with:
          script: |
            const { finishPendingReports } = require('./bench/continuous/lifecycle.ts');
            const { VARIANTS } = require('./bench/catalog.ts');
            const env = process.env;
            const cancelled = env.QUEUE_RESULT === 'cancelled' || env.MEASURE_RESULT === 'cancelled';
            const superseded = env.MEASURE_RESULT === 'success' && env.ELIGIBLE !== 'true';
            const reason = cancelled ? 'tracking was cancelled'
              : superseded ? 'the source was closed or superseded before measurement'
              : 'tracking ended without publishing all configuration results';
            await finishPendingReports({ github, context, core, hash: env.HASH,
              number: env.PR_NUMBER, variants: VARIANTS,
              conclusion: cancelled || superseded ? 'cancelled' : 'failure', reason });

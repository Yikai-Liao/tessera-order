name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Whether the benchmark report publishes its check; reuse of measurement depends on it.
  PUBLISH: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Only the diff. Every language job waits for these outputs, so nothing that
  # could run in parallel with them belongs here.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      rust: ${{ steps.changes.outputs.rust }}
      cpp: ${{ steps.changes.outputs.cpp }}
      cpp_present: ${{ steps.changes.outputs.cpp_present }}
      go: ${{ steps.changes.outputs.go }}
      comparison: ${{ steps.changes.outputs.comparison }}
      benchmark: ${{ steps.changes.outputs.benchmark }}
      benchmark_go: ${{ steps.changes.outputs.benchmark_go }}
      benchmark_go_reused: ${{ steps.changes.outputs.benchmark_go_reused }}
      docs: ${{ steps.changes.outputs.docs }}
      record: ${{ steps.changes.outputs.record }}
      benchmark_reused: ${{ steps.changes.outputs.benchmark_reused }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - id: changes
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          # A PR run tests its merge commit and may reuse lanes verified on identical inputs.
          TESTED: ${{ github.event_name == 'pull_request' && github.sha || '' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          bun .github/scripts/ci_changes.ts --base "$BASE" --head "$HEAD" --out "$GITHUB_OUTPUT" \
            ${TESTED:+--reuse "$TESTED"}
      - name: Explain deferred C++ checks
        if: steps.changes.outputs.cpp == 'true' && steps.changes.outputs.cpp_present != 'true'
        run: echo 'C++ is planned; checks activate when cpp/CMakeLists.txt is added.' >> "$GITHUB_STEP_SUMMARY"


  # Repository-wide formatting, tooling checks and Rust source policies.
  # The lint and language jobs run in parallel.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run tools:typecheck
      - run: bun run tools:test

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    uses: ./.github/workflows/rust-ci.yml

  cpp:
    needs: changes
    if: needs.changes.outputs.cpp == 'true' && needs.changes.outputs.cpp_present == 'true'
    uses: ./.github/workflows/cpp-ci.yml

  go:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    uses: ./.github/workflows/go-ci.yml

  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    uses: ./.github/workflows/docs.yml
    permissions:
      contents: read
      pages: write
      id-token: write

  # The single required check for branch protection. Language jobs are skipped
  # when their paths did not change, so it passes on success or skip and fails
  # on any failure or cancellation.
  ci-ok:
    if: always()
    needs: [changes, lint, rust, cpp, go, docs, comparison, registry-msvc, benchmark-rust, benchmark-go]
    runs-on: ubuntu-latest
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<< "$NEEDS"

  # A passing PR run records each lane it verified, or reused, as an artifact
  # named by the lane's input fingerprint. Artifacts name their run, which is
  # what lets a later push trust them.
  record:
    needs: [changes, ci-ok]
    # Skipped lanes upstream would skip this job under the implicit success().
    if: always() && needs.ci-ok.result == 'success' && needs.changes.outputs.record != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        name: ${{ fromJSON(needs.changes.outputs.record) }}
    steps:
      - run: echo "$GITHUB_SHA" > "$RUNNER_TEMP/marker"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: ${{ runner.temp }}/marker
          retention-days: 30
          overwrite: true

  registry-msvc:
    name: Native registry (MSVC)
    needs: changes
    if: needs.changes.outputs.comparison == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compile native registry with both MSVC preprocessors
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$installation) { throw "MSVC installation not found" }
          $setup = Join-Path $installation "Common7\Tools\VsDevCmd.bat"
          foreach ($preprocessor in @("/Zc:preprocessor", "/Zc:preprocessor-")) {
            cmd /c "call `"$setup`" -arch=x64 -host_arch=x64 && cl /nologo /std:c++17 /permissive- /W4 /WX $preprocessor /c bench\rust\native\registry.cpp /Fo`"$env:RUNNER_TEMP\registry.obj`""
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

  comparison:
    name: Implementation harness (Rust, C++ and Go)
    needs: changes
    if: needs.changes.outputs.comparison == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TESSERA_BENCH_TARGET_DIR: ${{ github.workspace }}/target/comparison
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target/comparison"
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # Keep the native objects in tessera-bench's build-script output.
          cache-workspace-crates: true
          shared-key: comparison-native-${{ hashFiles('bench/rust/native/**', '!bench/rust/native/**/*.test.ts') }}
          env-vars: CARGO CC CFLAGS CXX CMAKE RUST ImageOS ImageVersion
      - run: cargo fmt --all --check
      - uses: actions/cache@v6
        with:
          path: bench/vendor
          key: native-sources-${{ runner.os }}-${{ hashFiles('bench/rust/native/sources.toml') }}
      - name: Install native benchmark tools
        timeout-minutes: 5
        run: bash .github/scripts/install_native_tools.sh
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Check benchmark Rust code without native linkage
        env:
          TESSERA_BENCH_CHECK_ONLY: "1"
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo clippy -p tessera-bench --all-targets --all-features --target-dir "$TESSERA_BENCH_TARGET_DIR" -- -D warnings
          cargo doc -p tessera-bench --no-deps --all-features --target-dir "$TESSERA_BENCH_TARGET_DIR"
      - name: Compile native registry with GCC and Clang
        run: |
          for compiler in g++ clang++; do
            "$compiler" -std=c++17 -pedantic-errors -Wall -Wextra -Werror \
              -c bench/rust/native/registry.cpp -o "$RUNNER_TEMP/registry.o"
          done
      - run: bun run tools --verbose ci check --native --out bench/results/ci
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.4"
          cache-dependency-path: bench/go/go.sum
      - name: Check Go benchmark worker
        working-directory: bench/go
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...
          GOEXPERIMENT=simd go vet ./...
          GOEXPERIMENT=simd go test ./...
      - run: bun run tools ci check --go --out bench/results/ci-go
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: comparison-check-log
          path: |
            bench/results/ci.log
            bench/results/ci-go.log
          if-no-files-found: ignore


  benchmark-rust:
    name: Benchmarks
    needs: changes
    if: github.event_name == 'pull_request' && (needs.changes.outputs.benchmark == 'true' || needs.changes.outputs.benchmark_reused != '')
    uses: ./.github/workflows/pr-benchmarks.yml
    with:
      language: rust
      publish: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}
      reused-from: ${{ needs.changes.outputs.benchmark_reused }}
    permissions:
      contents: write
      checks: write
      pull-requests: write
    secrets: inherit

  benchmark-go:
    name: Benchmarks (go)
    needs: changes
    if: github.event_name == 'pull_request' && (needs.changes.outputs.benchmark_go == 'true' || needs.changes.outputs.benchmark_go_reused != '')
    uses: ./.github/workflows/pr-benchmarks.yml
    with:
      language: go
      publish: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}
      reused-from: ${{ needs.changes.outputs.benchmark_go_reused }}
    permissions:
      contents: write
      checks: write
      pull-requests: write
    secrets: inherit

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Only the diff. Every language job waits for these outputs, so nothing that
  # could run in parallel with them belongs here.
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.changes.outputs.rust }}
      cpp: ${{ steps.changes.outputs.cpp }}
      cpp_present: ${{ steps.changes.outputs.cpp_present }}
      comparison: ${{ steps.changes.outputs.comparison }}
      benchmark: ${{ steps.changes.outputs.benchmark }}
      docs: ${{ steps.changes.outputs.docs }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - id: changes
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bun .github/scripts/ci_changes.ts --base "$BASE" --head "$HEAD" --out "$GITHUB_OUTPUT"
      - name: Explain deferred C++ checks
        if: steps.changes.outputs.cpp == 'true' && steps.changes.outputs.cpp_present != 'true'
        run: echo 'C++ is planned; checks activate when cpp/CMakeLists.txt is added.' >> "$GITHUB_STEP_SUMMARY"


  # Formatting and lints for TypeScript, Vue, CSS, JSON and the CI
  # scripts. These checks cover the whole repository on every
  # run. No language build reads these settings, so this job runs beside the
  # language jobs instead of gating them.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run tools:typecheck
      - run: bun run tools:test

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    uses: ./.github/workflows/rust-ci.yml

  cpp:
    needs: changes
    if: needs.changes.outputs.cpp == 'true' && needs.changes.outputs.cpp_present == 'true'
    uses: ./.github/workflows/cpp-ci.yml

  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    uses: ./.github/workflows/docs.yml
    permissions:
      contents: read
      pages: write
      id-token: write

  # The single required check for branch protection. Language jobs are skipped
  # when their paths did not change, so it passes on success or skip and fails
  # on any failure or cancellation.
  ci-ok:
    if: always()
    needs: [changes, lint, rust, cpp, docs, comparison, registry-msvc, prepare, measure, report]
    runs-on: ubuntu-latest
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<< "$NEEDS"

  registry-msvc:
    name: Native registry (MSVC)
    needs: changes
    if: needs.changes.outputs.comparison == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compile native registry with both MSVC preprocessors
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$installation) { throw "MSVC installation not found" }
          $setup = Join-Path $installation "Common7\Tools\VsDevCmd.bat"
          foreach ($preprocessor in @("/Zc:preprocessor", "/Zc:preprocessor-")) {
            cmd /c "call `"$setup`" -arch=x64 -host_arch=x64 && cl /nologo /std:c++17 /permissive- /W4 /WX $preprocessor /c bench\rust\native\registry.cpp /Fo`"$env:RUNNER_TEMP\registry.obj`""
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

  comparison:
    name: Algorithm harness (Rust and C++)
    needs: changes
    if: needs.changes.outputs.comparison == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TESSERA_BENCH_TARGET_DIR: ${{ github.workspace }}/target/comparison
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target/comparison"
          # Keep the native objects in tessera-bench's build-script output.
          cache-workspace-crates: true
          shared-key: comparison-native-${{ hashFiles('bench/rust/native/**', '!bench/rust/native/**/*.test.ts') }}
          env-vars: CARGO CC CFLAGS CXX CMAKE RUST ImageOS ImageVersion
      - run: cargo fmt --all --check
      - uses: actions/cache@v6
        with:
          path: bench/vendor
          key: native-sources-${{ runner.os }}-${{ hashFiles('bench/rust/native/sources.toml') }}
      - name: Install native benchmark tools
        timeout-minutes: 5
        run: bash .github/scripts/install_native_tools.sh
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Check benchmark Rust code without native linkage
        env:
          TESSERA_BENCH_CHECK_ONLY: "1"
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo clippy -p tessera-bench --all-targets --all-features --target-dir "$TESSERA_BENCH_TARGET_DIR" -- -D warnings
          cargo doc -p tessera-bench --no-deps --all-features --target-dir "$TESSERA_BENCH_TARGET_DIR"
      - name: Compile native registry with GCC and Clang
        run: |
          for compiler in g++ clang++; do
            "$compiler" -std=c++17 -pedantic-errors -Wall -Wextra -Werror \
              -c bench/rust/native/registry.cpp -o "$RUNNER_TEMP/registry.o"
          done
      - run: bun run tools --verbose ci check --native --out bench/results/ci
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: comparison-check-log
          path: bench/results/ci.log
          if-no-files-found: ignore


  prepare:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.benchmark == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TESSERA_BENCH_TARGET_DIR: ${{ github.workspace }}/target/continuous
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
      baseline: ${{ steps.build.outputs.baseline }}
      artifact: ${{ steps.artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target/continuous"
          shared-key: continuous
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile --ignore-scripts
      - id: matrix
        run: echo "value=$(bun run --silent tools continuous matrix)" >> "$GITHUB_OUTPUT"
      - name: Build both revisions once
        id: build
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          baseline=$(git merge-base "$PR_BASE" HEAD)
          echo "baseline=$baseline" >> "$GITHUB_OUTPUT"
          bun run tools continuous prepare "$baseline" \
            --out bench/results/prepared
      - name: Retain preparation log
        if: always()
        run: |
          if [ -f bench/results/prepared.log ]; then
            mkdir -p bench/results/prepared
            cp bench/results/prepared.log bench/results/prepared/preparation.log
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        id: artifact
        with:
          name: prepared-revisions-${{ github.run_attempt }}
          path: bench/results/prepared/
          retention-days: 14
          if-no-files-found: error

  measure:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact }}
          merge-multiple: true
          path: bench/results/prepared
      - name: Measure retained revisions without compiling
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          bun run tools continuous measure bench/results/prepared --shard "$SHARD" \
            --out bench/results/continuous
      - name: Retain measurement log
        if: always()
        run: |
          if [ -f bench/results/continuous.log ]; then
            mkdir -p bench/results/continuous
            cp bench/results/continuous.log bench/results/continuous/measurement.log
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ matrix.artifact }}-${{ needs.prepare.outputs.artifact }}
          path: |
            bench/results/continuous/
            !bench/results/continuous/binaries/**
          retention-days: 14
          if-no-files-found: warn

  report:
    needs: [prepare, measure]
    if: always() && !cancelled() && needs.prepare.result == 'success'
    runs-on: ubuntu-24.04
    environment: benchmark
    timeout-minutes: 10
    env:
      PUBLISH: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}
    permissions:
      contents: write
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact }}
          merge-multiple: true
          path: ${{ runner.temp }}/prepared
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: paired-*-${{ needs.prepare.outputs.artifact }}
          path: ${{ runner.temp }}/paired
      - uses: bencherdev/bencher@7de3c69a85380826613050826b4bce062be2f07d # v0.6.16
        continue-on-error: true
        if: env.PUBLISH == 'true'
        with:
          version: 0.6.16
      - name: Upload paired JSON to Bencher Cloud
        id: upload
        continue-on-error: true
        if: env.PUBLISH == 'true'
        env:
          BENCHER_API_KEY: ${{ secrets.BENCHER_API_KEY }}
          BENCHER_PROJECT: ${{ vars.BENCHER_PROJECT }}
          HASH: ${{ github.event.pull_request.head.sha }}
          BASE_HASH: ${{ needs.prepare.outputs.baseline }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          bun run tools continuous submit --project "$BENCHER_PROJECT" \
            --hash "$HASH" --base-hash "$BASE_HASH" --pr "$PR_NUMBER" \
            --prepared "$RUNNER_TEMP/prepared" --artifacts "$RUNNER_TEMP/paired" \
            --out "$RUNNER_TEMP/submission"
      - name: Publish paired checks and PR report
        run: bun .github/scripts/publish-report.ts
        env:
          HASH: ${{ github.event.pull_request.head.sha }}
          BASE_HASH: ${{ needs.prepare.outputs.baseline }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.ref }}
          GITHUB_TOKEN: ${{ env.PUBLISH == 'true' && github.token || '' }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: continuous-submission
          path: |
            ${{ runner.temp }}/submission/
            ${{ runner.temp }}/submission.log
          if-no-files-found: ignore
      - name: Preserve Cloud archival failure
        if: always() && steps.upload.outcome == 'failure'
        run: exit 1

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Only the diff. Every language job waits for these outputs, so nothing that
  # could run in parallel with them belongs here.
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.changes.outputs.rust }}
      cpp: ${{ steps.changes.outputs.cpp }}
      cpp_present: ${{ steps.changes.outputs.cpp_present }}
      python: ${{ steps.changes.outputs.python }}
      python_present: ${{ steps.changes.outputs.python_present }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: changes
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 .github/scripts/ci_changes.py --base "$BASE" --head "$HEAD" --out "$GITHUB_OUTPUT"
      - name: Explain deferred C++ checks
        if: steps.changes.outputs.cpp == 'true' && steps.changes.outputs.cpp_present != 'true'
        run: echo 'C++ is planned; checks activate when cpp/CMakeLists.txt is added.' >> "$GITHUB_STEP_SUMMARY"

      - name: Explain deferred Python checks
        if: steps.changes.outputs.python == 'true' && steps.changes.outputs.python_present != 'true'
        run: echo 'Python is planned; checks activate when its pyproject.toml and Cargo.toml are added.' >> "$GITHUB_STEP_SUMMARY"

  # Formatting and lints for TypeScript, Vue, CSS, JSON, Python and the CI
  # scripts. Both tools are fast, so they check the whole repository on every
  # run. No language build reads these settings, so this job runs beside the
  # language jobs instead of gating them.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test the CI scripts
        run: |
          python3 -m unittest discover -s .github/scripts -p "test_*.py"
          python3 -m unittest discover -s bench/continuous -p "test_*.py"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install pinned OKF CLI
        run: |
          mkdir -p "$RUNNER_TEMP/okf"
          curl --fail --location --silent --show-error \
            https://github.com/okfcli/okf/releases/download/v0.5.2/okf_0.5.2_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/okf/archive.tar.gz"
          echo "05ecf191f1ef1396cdeefa9a1fd877d491b32b91f2a4a4d06393656e880e90b6  $RUNNER_TEMP/okf/archive.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/okf/archive.tar.gz" -C "$RUNNER_TEMP/okf" okf
          echo "$RUNNER_TEMP/okf" >> "$GITHUB_PATH"
      # Retrieval tests also build and validate the repository corpus.
      - run: pnpm knowledge:test
      - run: pnpm lint
      - run: pipx run ruff==0.17.4 format --check
      - run: pipx run ruff==0.17.4 check
      - run: pnpm bench:typecheck
      - run: pnpm bench:test

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    uses: ./.github/workflows/rust-ci.yml

  cpp:
    needs: changes
    if: needs.changes.outputs.cpp == 'true' && needs.changes.outputs.cpp_present == 'true'
    uses: ./.github/workflows/cpp-ci.yml

  python:
    needs: changes
    if: needs.changes.outputs.python == 'true' && needs.changes.outputs.python_present == 'true'
    uses: ./.github/workflows/python-ci.yml

  # The single required check for branch protection. Language jobs are skipped
  # when their paths did not change, so it passes on success or skip and fails
  # on any failure or cancellation.
  ci-ok:
    if: always()
    needs: [changes, lint, rust, cpp, python]
    runs-on: ubuntu-latest
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<< "$NEEDS"

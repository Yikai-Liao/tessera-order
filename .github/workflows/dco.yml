name: DCO

on:
  pull_request:

permissions:
  contents: read

# A newer push or title edit supersedes the check still running.
concurrency:
  group: dco-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sign-off:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Check with the target branch's script, not PR-controlled code.
          ref: ${{ github.event.pull_request.base.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          # The trusted base may predate the Bun manifest pin.
          bun-version: 1.4.4
      - name: Check Signed-off-by on every commit
        env:
          # Read-only access verifies individual Dependabot commits; it does
          # not exempt a PR's other commits or trust its author fields.
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # Fetch objects for fork heads without checking out or running them.
          git fetch --no-tags origin "$HEAD"
          bun .github/scripts/check-dco.ts "$BASE" "$HEAD"

name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "conformance/**"
      - "ROADMAP.md"
      - "RELEASING.md"
      - "CONTRIBUTING.md"
      - "CHANGELOG.md"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "conformance/**"
      - "ROADMAP.md"
      - "RELEASING.md"
      - "CONTRIBUTING.md"
      - "CHANGELOG.md"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # `lastUpdated` reads each page's commit date.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run docs:test
      - run: npm run docs:typecheck
      - run: npm run docs:build
        env:
          # GitHub Pages serves a project site under /<repository>/.
          DOCS_BASE: /${{ github.event.repository.name }}/
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

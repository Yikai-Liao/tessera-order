name: Docs

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # `lastUpdated` reads each page's commit date.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      # The figures replay the engine, built for WebAssembly by `docs:wasm`.
      # wasm32 is a documentation build target, not a supported library platform.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust/tessera-trace -> ../../target/trace"
      - run: bun install --frozen-lockfile
      - run: cargo test -p tessera-sort --lib --features trace trace::
      - run: >-
          cargo clippy --manifest-path rust/tessera-trace/Cargo.toml
          --target wasm32-unknown-unknown --target-dir target/trace -- -D warnings
      - run: bun run docs:test
      - run: bun run docs:typecheck
      - run: bun run docs:build
        env:
          # GitHub Pages serves a project site under /<repository>/.
          DOCS_BASE: /${{ github.event.repository.name }}/
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

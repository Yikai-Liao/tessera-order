# SPDX-License-Identifier: BSD-2-Clause
name: Performance tracking

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      algorithm:
        description: Catalog algorithm ID to measure, or all to measure every production algorithm in turn
        required: true
        type: string
        default: tessera

permissions:
  contents: read

# Do not coalesce pending main pushes. Bencher owns the single remote execution slot.
jobs:
  changes:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.MAIN_BENCHMARKS_ENABLED == 'true')
    runs-on: ubuntu-24.04
    outputs:
      benchmark: ${{ steps.changes.outputs.benchmark }}
      matrix: ${{ steps.selection.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - id: changes
        env:
          BASE: ${{ github.event.before }}
        run: bun .github/scripts/ci_changes.ts --base "$BASE" --head "$GITHUB_SHA" --out "$GITHUB_OUTPUT"

      - run: bun install --frozen-lockfile --ignore-scripts
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.benchmark == 'true'
      - id: selection
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.benchmark == 'true'
        env:
          TRACKING_ALGORITHM: ${{ github.event_name == 'workflow_dispatch' && inputs.algorithm || 'tessera' }}
        run: bun bench/tracking/algorithms.ts

  # Builds need no credentials and run in parallel; each freezes one tested image as an artifact.
  build:
    needs: changes
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.benchmark == 'true')
    name: Build (${{ matrix.algorithm }})
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TRACKING_ALGORITHM: ${{ matrix.algorithm }}
      CC: clang
      CXX: clang++
      TESSERA_BENCH_TARGET_DIR: ${{ github.workspace }}/target/main-tracking
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/cache@v6
        if: matrix.native
        with:
          path: bench/vendor
          key: native-sources-${{ runner.os }}-${{ hashFiles('bench/rust/native/sources.toml') }}
      - name: Install native benchmark tools
        if: matrix.native
        timeout-minutes: 5
        run: bash .github/scripts/install_native_tools.sh
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target/main-tracking"
          shared-key: main-tracking-static-gnu
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Build and test the frozen image
        run: bun bench/tracking/build.ts
      - uses: actions/upload-artifact@v7
        with:
          name: tracking-build-${{ matrix.algorithm }}
          path: |
            bench/results/tracking-build/build.json
            bench/results/tracking-build/image.tar
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: tracking-build-log-${{ matrix.algorithm }}
          path: bench/results/tracking-build.log
          retention-days: 14
          if-no-files-found: ignore

  # Measurement waits for every build, then runs one algorithm at a time: Bencher has a single
  # remote slot, and Actions concurrency groups would cancel queued jobs rather than hold them.
  # An algorithm whose build failed fails here when its artifact is missing; the others continue.
  track:
    needs: [changes, build]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.benchmark == 'true') }}
    name: Track (${{ matrix.algorithm }})
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    runs-on: ubuntu-24.04
    environment: benchmark
    # run.ts waits up to 50 minutes for its remote jobs, queueing included.
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      TRACKING_ALGORITHM: ${{ matrix.algorithm }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile --ignore-scripts
      - uses: bencherdev/bencher@7de3c69a85380826613050826b4bce062be2f07d # v0.6.16
        with:
          version: 0.6.16
      - uses: actions/download-artifact@v8
        with:
          name: tracking-build-${{ matrix.algorithm }}
          path: bench/results/tracking-build
      - name: Push the frozen image and measure its remote jobs
        env:
          BENCHER_API_KEY: ${{ secrets.BENCHER_API_KEY }}
          BENCHER_PROJECT: ${{ vars.BENCHER_PROJECT }}
        run: |
          set -euo pipefail
          printf '%s' "$BENCHER_API_KEY" | docker login registry.bencher.dev -u "$BENCHER_PROJECT" --password-stdin
          trap 'docker logout registry.bencher.dev' EXIT
          bun bench/tracking/run.ts
      - name: Append monthly summary with ordinary Git
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh auth setup-git
          git init -q bench/results/history
          cd bench/results/history
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            remote=$(git ls-remote --heads origin benchmark-data)
            if [ -n "$remote" ]; then
              git fetch origin benchmark-data
              git checkout -B benchmark-data FETCH_HEAD
            else
              git checkout --orphan "initial-$attempt"
            fi
            bun "$GITHUB_WORKSPACE/bench/tracking/publish.ts" "$TRACKING_ALGORITHM" ../tracking/*.jsonl
            git add -- "$TRACKING_ALGORITHM" comparison.json
            git diff --cached --quiet && break
            git commit -s -m "chore(bench): record $TRACKING_ALGORITHM performance ${GITHUB_SHA:0:7}" -m 'Assisted-by: OpenAI'
            git push origin HEAD:refs/heads/benchmark-data && break
            [ "$attempt" != 3 ] || exit 1
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: performance-evidence-${{ matrix.algorithm }}
          path: |
            bench/results/tracking/*.jsonl
            bench/results/tracking/bencher-*.json
            bench/results/tracking.log
          retention-days: 14
          if-no-files-found: ignore

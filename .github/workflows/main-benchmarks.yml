# SPDX-License-Identifier: BSD-2-Clause
name: Main performance tracking

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Do not coalesce pending main pushes. Bencher owns the single remote execution slot.
jobs:
  changes:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.MAIN_BENCHMARKS_ENABLED == 'true')
    runs-on: ubuntu-24.04
    outputs:
      benchmark: ${{ steps.changes.outputs.benchmark }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - id: changes
        env:
          BASE: ${{ github.event.before }}
        run: bun .github/scripts/ci_changes.ts --base "$BASE" --head "$GITHUB_SHA" --out "$GITHUB_OUTPUT"

  track:
    needs: changes
    if: needs.changes.outputs.benchmark == 'true'
    runs-on: ubuntu-24.04
    environment: benchmark-main
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      TESSERA_BENCH_TARGET_DIR: ${{ github.workspace }}/target/main-tracking
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target/main-tracking"
          shared-key: main-tracking-static-gnu
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile --ignore-scripts
      - uses: bencherdev/bencher@7de3c69a85380826613050826b4bce062be2f07d # v0.6.16
        with:
          version: 0.6.16
      - name: Build minimal image and measure one complete run
        env:
          BENCHER_API_KEY: ${{ secrets.BENCHER_API_KEY }}
          BENCHER_PROJECT: ${{ vars.BENCHER_PROJECT }}
        run: |
          set -euo pipefail
          printf '%s' "$BENCHER_API_KEY" | docker login registry.bencher.dev -u "$BENCHER_PROJECT" --password-stdin
          trap 'docker logout registry.bencher.dev' EXIT
          bun bench/tracking/run.ts
      - name: Append monthly summary with ordinary Git
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh auth setup-git
          git init -q bench/results/history
          cd bench/results/history
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            remote=$(git ls-remote --heads origin benchmark-data)
            if [ -n "$remote" ]; then
              git fetch origin benchmark-data
              git checkout -B benchmark-data FETCH_HEAD
            else
              git checkout --orphan "initial-$attempt"
            fi
            bun "$GITHUB_WORKSPACE/bench/tracking/publish.ts" ../main/*.jsonl
            git add main
            git diff --cached --quiet && break
            git commit -s -m "chore(bench): record main performance ${GITHUB_SHA:0:7}" -m 'Assisted-by: OpenAI'
            git push origin HEAD:refs/heads/benchmark-data && break
            [ "$attempt" != 3 ] || exit 1
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: main-performance-evidence
          path: |
            bench/results/main/*.jsonl
            bench/results/main/bencher.json
            bench/results/main.log
          retention-days: 14
          if-no-files-found: ignore

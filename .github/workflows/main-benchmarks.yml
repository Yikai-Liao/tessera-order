# SPDX-License-Identifier: BSD-2-Clause
name: Performance tracking

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      algorithm:
        description: Algorithm to measure; all runs algorithms sequentially
        required: true
        type: choice
        default: tessera
        options:
          - tessera
          - all
          - rust-std-stable
          - rust-std-unstable
          - glidesort
          - glidesort-sqrt
          - radsort
          - voracious
          - rdst
          - clausecker
          - fluxsort
          - ips2ra
          - ips4o
          - vqsort
          - x86simdsort
          - crumsort
          - duckdb
          - tessera-par-1
          - tessera-par-2
          - tessera-par-4
          - tessera-par-8
          - rayon-stable-1
          - rayon-stable-2
          - rayon-stable-4
          - rayon-stable-8

permissions:
  contents: read

# Do not coalesce pending main pushes. Bencher owns the single remote execution slot.
jobs:
  changes:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.MAIN_BENCHMARKS_ENABLED == 'true')
    runs-on: ubuntu-24.04
    outputs:
      benchmark: ${{ steps.changes.outputs.benchmark }}
      matrix: ${{ steps.selection.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - id: changes
        env:
          BASE: ${{ github.event.before }}
        run: bun .github/scripts/ci_changes.ts --base "$BASE" --head "$GITHUB_SHA" --out "$GITHUB_OUTPUT"

      - run: bun install --frozen-lockfile --ignore-scripts
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.benchmark == 'true'
      - id: selection
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.benchmark == 'true'
        env:
          TRACKING_ALGORITHM: ${{ github.event_name == 'workflow_dispatch' && inputs.algorithm || 'tessera' }}
        run: bun bench/tracking/algorithms.ts

  track:
    needs: changes
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.benchmark == 'true')
    name: Track (${{ matrix.algorithm }})
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    runs-on: ubuntu-24.04
    environment: benchmark
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      TRACKING_ALGORITHM: ${{ matrix.algorithm }}
      CC: clang
      CXX: clang++
      TESSERA_BENCH_TARGET_DIR: ${{ github.workspace }}/target/main-tracking
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/cache@v6
        if: matrix.native
        with:
          path: bench/vendor
          key: native-sources-${{ runner.os }}-${{ hashFiles('bench/rust/native/sources.toml') }}
      - name: Install native benchmark tools
        if: matrix.native
        timeout-minutes: 5
        run: bash .github/scripts/install_native_tools.sh
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target/main-tracking"
          shared-key: main-tracking-static-gnu
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile --ignore-scripts
      - uses: bencherdev/bencher@7de3c69a85380826613050826b4bce062be2f07d # v0.6.16
        with:
          version: 0.6.16
      - name: Build frozen image and measure complete algorithm coverage
        env:
          BENCHER_API_KEY: ${{ secrets.BENCHER_API_KEY }}
          BENCHER_PROJECT: ${{ vars.BENCHER_PROJECT }}
        run: |
          set -euo pipefail
          printf '%s' "$BENCHER_API_KEY" | docker login registry.bencher.dev -u "$BENCHER_PROJECT" --password-stdin
          trap 'docker logout registry.bencher.dev' EXIT
          bun bench/tracking/run.ts
      - name: Append monthly summary with ordinary Git
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh auth setup-git
          git init -q bench/results/history
          cd bench/results/history
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            remote=$(git ls-remote --heads origin benchmark-data)
            if [ -n "$remote" ]; then
              git fetch origin benchmark-data
              git checkout -B benchmark-data FETCH_HEAD
            else
              git checkout --orphan "initial-$attempt"
            fi
            bun "$GITHUB_WORKSPACE/bench/tracking/publish.ts" ../tracking/*.jsonl
            git add .
            git diff --cached --quiet && break
            git commit -s -m "chore(bench): record $TRACKING_ALGORITHM performance ${GITHUB_SHA:0:7}" -m 'Assisted-by: OpenAI'
            git push origin HEAD:refs/heads/benchmark-data && break
            [ "$attempt" != 3 ] || exit 1
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: performance-evidence-${{ matrix.algorithm }}
          path: |
            bench/results/tracking/*.jsonl
            bench/results/tracking/bencher-*.json
            bench/results/tracking/inventory.json
            bench/results/tracking.log
          retention-days: 14
          if-no-files-found: ignore

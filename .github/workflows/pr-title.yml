name: PR title

# The squash merge makes the title the commit summary on main.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

# A newer push or title edit supersedes the check still running.
concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-title:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Check the title against CONTRIBUTING.md
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: bun .github/scripts/check_pr_title.ts

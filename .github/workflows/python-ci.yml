# SPDX-License-Identifier: BSD-2-Clause
name: Python CI

on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "python -> target"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          save-cache: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --manifest-path python/Cargo.toml -- --check
      - run: cargo clippy --manifest-path python/Cargo.toml --all-targets -- -D warnings
      - run: cargo clippy --manifest-path python/Cargo.toml --all-targets --features extension-module,abi3-py311 -- -D warnings
      - run: cargo test --manifest-path python/Cargo.toml
      - run: uvx mypy --strict --python-version 3.11 --ignore-missing-imports python/python/tessera_order/__init__.pyi

  # Keep the pull request matrix at four cells, including a non-abi3 build.
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.13"
            abi3: "true"
            with-numpy: "true"
            test-numpy-free: "true"
          - os: ubuntu-latest
            python-version: "3.10"
            abi3: "false"
            with-numpy: "true"
          - os: macos-latest
            python-version: "3.13"
            abi3: "true"
            with-numpy: "true"
          - os: windows-latest
            python-version: "3.13"
            abi3: "true"
            with-numpy: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/python-test
        with:
          python-version: ${{ matrix.python-version }}
          abi3: ${{ matrix.abi3 }}
          with-numpy: ${{ matrix.with-numpy }}
          test-numpy-free: ${{ matrix.test-numpy-free || 'false' }}

  # Remaining platforms and interpreter boundaries run on main and release tags.
  test-other-platforms:
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04-arm
            python-version: "3.13"
            abi3: "true"
            with-numpy: "true"
          - os: ubuntu-latest
            python-version: "3.9"
            abi3: "false"
            with-numpy: "true"
          - os: ubuntu-latest
            python-version: "3.11"
            abi3: "true"
            with-numpy: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/python-test
        with:
          python-version: ${{ matrix.python-version }}
          abi3: ${{ matrix.abi3 }}
          with-numpy: ${{ matrix.with-numpy }}

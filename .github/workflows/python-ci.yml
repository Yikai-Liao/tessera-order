name: Python CI

on:
  workflow_call:

permissions:
  contents: read

# This scaffold activates only after both Python package manifests exist.
# Confirm supported Python versions and pin binding dependencies when porting.
jobs:
  test:
    name: Python (${{ matrix.os }}, ${{ matrix.python }}, NumPy ${{ matrix.numpy }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
        python: ['3.11', '3.13']
        numpy: [absent, present]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install maturin==1.11.5 pytest
      - if: matrix.numpy == 'present'
        run: python -m pip install numpy
      - if: matrix.numpy == 'absent'
        run: python -c "import importlib.util; assert importlib.util.find_spec('numpy') is None"
      - run: maturin build --release --manifest-path python/Cargo.toml --interpreter python --out dist
      - name: Install the built wheel
        run: python -c "import glob, subprocess, sys; wheels = glob.glob('dist/*.whl'); assert len(wheels) == 1; subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--no-deps', wheels[0]])"
      - run: python -m pytest python/tests

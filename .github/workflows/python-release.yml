name: Python release build

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/python-ci.yml

  wheels:
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Check Python tag and extension version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python -c "import os,tomllib; p=tomllib.load(open('python/pyproject.toml','rb'))['project']; c=tomllib.load(open('python/Cargo.toml','rb'))['package']; v=p.get('version',c['version']); assert v == c['version']; assert os.environ['RELEASE_TAG'] == 'python/v' + v"
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          maturin-version: v1.11.5
          manylinux: '2_28'
          args: --release --manifest-path python/Cargo.toml --compatibility pypi --out dist -i python${{ matrix.python }}
      - uses: actions/upload-artifact@v7
        with:
          name: python-wheels-${{ matrix.os }}-${{ matrix.python }}
          path: dist/*.whl
          if-no-files-found: error

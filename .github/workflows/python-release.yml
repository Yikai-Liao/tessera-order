# SPDX-License-Identifier: BSD-2-Clause
name: Python release

on:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Check tag against package and core versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          core_version="${RELEASE_TAG#python/v}"
          core_version="${core_version%%.post*}"
          git fetch --no-tags --force origin "refs/tags/rust/v$core_version:refs/tags/rust/v$core_version" || true
          bun run tools release verify --tag "$RELEASE_TAG" --check-published
      # Fetch the annotated tag object; a commit-only checkout loses its notes.
      - name: Read release notes before building artifacts
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git fetch --no-tags --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          bun run --silent tools release notes --tag "$RELEASE_TAG" --commit "$GITHUB_SHA" > "$RUNNER_TEMP/release-notes.md"
      - uses: actions/upload-artifact@v7
        with:
          name: python-release-notes
          path: ${{ runner.temp }}/release-notes.md
          if-no-files-found: error

  validate:
    needs: verify
    uses: ./.github/workflows/python-ci.yml

  wheels:
    needs: [verify, validate]
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
        wheel:
          - tag: cp39
            python-version: "3.9"
            features: ""
          - tag: cp310
            python-version: "3.10"
            features: ""
          - tag: cp311-abi3
            python-version: "3.11"
            features: "--features abi3-py311"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.wheel.python-version }}
          save-cache: false
      # Linux build interpreters live inside the manylinux container.
      - uses: actions/setup-python@v6
        if: runner.os != 'Linux'
        with:
          python-version: ${{ matrix.wheel.python-version }}
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          manylinux: "2014"
          args: >-
            --release --locked -m python/Cargo.toml --out dist
            --interpreter ${{ runner.os == 'Linux' && format('python{0}', matrix.wheel.python-version) || 'python' }}
            ${{ matrix.wheel.features }}
      - name: Test release wheel with NumPy
        shell: bash
        env:
          PYTHON_VERSION: ${{ matrix.wheel.python-version }}
        run: |
          venv="$RUNNER_TEMP/release-wheel-tests"
          uv venv --python "$PYTHON_VERSION" "$venv"
          uv pip install --python "$venv" pytest numpy dist/*.whl
          uv run --no-project --python "$venv" python -m pytest python/tests -q
      - name: Test abi3 release wheel without NumPy
        if: matrix.wheel.tag == 'cp311-abi3'
        shell: bash
        env:
          PYTHON_VERSION: ${{ matrix.wheel.python-version }}
        run: |
          venv="$RUNNER_TEMP/release-wheel-tests-numpy-free"
          uv venv --python "$PYTHON_VERSION" "$venv"
          uv pip install --python "$venv" pytest dist/*.whl
          uv run --no-project --python "$venv" python -c \
            'import importlib.util; assert importlib.util.find_spec("numpy") is None; import tessera_order'
          uv run --no-project --python "$venv" python -m pytest python/tests -q
      - uses: actions/upload-artifact@v7
        with:
          name: python-wheels-${{ matrix.platform.target }}-${{ matrix.wheel.tag }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    needs: [verify, validate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          save-cache: false
      - name: Build source distribution
        run: uvx maturin sdist -m python/Cargo.toml --out dist
      - name: Test installation from source distribution outside checkout
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test_dir="$RUNNER_TEMP/sdist-test"
          mkdir -p "$test_dir"
          cp dist/*.tar.gz "$test_dir/"
          cd "$test_dir" || exit 1
          uv venv --python 3.11 .venv
          uv pip install --python .venv pytest ./*.tar.gz
          cat > test_sdist.py <<'PYTEST'
          import os

          import tessera_order

          def test_sdist():
              version = os.environ["RELEASE_TAG"].removeprefix("python/v")
              assert tessera_order.__version__ == version
              assert tessera_order.__core_version__ == version.split(".post")[0]
              assert tessera_order.sort([3, 1, 2]) == [1, 2, 3]
              result = tessera_order.partition([3, 1, 2], 1)
              assert result[1] == 2
              assert sorted(result) == [1, 2, 3]
          PYTEST
          uv run --no-project --python .venv python -m pytest test_sdist.py -q
      - uses: actions/upload-artifact@v7
        with:
          name: python-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

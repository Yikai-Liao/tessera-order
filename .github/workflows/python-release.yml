name: Python release build

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/python-ci.yml

  wheels:
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check Python tag and extension version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: pnpm tools release verify python --tag "$RELEASE_TAG"
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          maturin-version: v1.11.5
          manylinux: '2_28'
          args: --release --manifest-path python/Cargo.toml --compatibility pypi --out dist -i python${{ matrix.python }}
      - uses: actions/upload-artifact@v7
        with:
          name: python-wheels-${{ matrix.os }}-${{ matrix.python }}
          path: dist/*.whl
          if-no-files-found: error

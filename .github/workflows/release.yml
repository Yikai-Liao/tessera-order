name: Release

on:
  push:
    tags: ['rust/v*', 'cpp/v*']

permissions:
  contents: read

# Published tags are immutable. Release jobs are never cancelled by a later tag.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rust:
    if: startsWith(github.ref_name, 'rust/v')
    uses: ./.github/workflows/rust-release.yml
    # crates.io trusted publishing matches this caller workflow (release.yml), not the callee.
    permissions:
      contents: write
      id-token: write

  cpp:
    if: startsWith(github.ref_name, 'cpp/v')
    uses: ./.github/workflows/cpp-release.yml
    permissions:
      contents: write

name: Rust CI

on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # The check name defaults to the job id plus the matrix values. A skipped job
  # never expands its matrix, so an explicit `name:` would surface as the raw
  # template; the default name shows only `test-other-platforms`.
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            toolchain: stable
          # Keep every 1.85 cell in sync with `rust-version` in Cargo.toml.
          - os: ubuntu-latest
            toolchain: "1.85"
          - os: macos-latest
            toolchain: stable
          - os: windows-latest
            toolchain: stable
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust-test
        with:
          toolchain: ${{ matrix.toolchain }}

  # A pull request validates one cell per operating system and the MSRV on
  # Linux. The remaining cells run on main, which no pull request waits for.
  test-other-platforms:
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04-arm
            toolchain: stable
          - os: ubuntu-24.04-arm
            toolchain: "1.85"
          - os: macos-latest
            toolchain: "1.85"
          - os: windows-latest
            toolchain: "1.85"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust-test
        with:
          toolchain: ${{ matrix.toolchain }}

  lint:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: thumbv7em-none-eabi
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo clippy --workspace --all-targets --all-features
      # Behavioral tests run in the host matrix above, including MSRV. This
      # target has no `std` to link accidentally, and clippy checks the no-std
      # code path.
      - run: cargo build -p tessera-sort --no-default-features --target thumbv7em-none-eabi
      - run: cargo clippy -p tessera-sort --no-default-features --all-targets
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo package -p tessera-sort
      - name: Test the portable-simd MSRV
        run: |
          rustup toolchain install 1.89 --profile minimal
          cargo +1.89 test -p tessera-sort --all-targets --all-features
        env:
          # Stable above enforces lints; the feature MSRV checks compatibility.
          RUSTFLAGS: ""

  miri:
    name: miri (${{ matrix.features }})
    runs-on: ubuntu-latest
    env:
      MIRI_SYSROOT: ${{ github.workspace }}/.miri-sysroot
      RUSTFLAGS: -D warnings
    strategy:
      fail-fast: false
      matrix:
        include:
          - features: std
            args: ""
            filter: ""
          - features: no-std
            args: --no-default-features
            filter: ""
          # The std lane interprets every engine path already. This lane only
          # has to interpret what the feature adds: its own unsafe vector code
          # and one integration case that runs the engine with it enabled. The
          # doctest step below stays unfiltered and interprets the engine through
          # the feature too. `test(=name)` matches the name inside the binary;
          # the binary id is not part of it.
          - features: portable-simd
            args: --features portable-simd
            filter: "-E 'test(portable_simd::tests) | test(=unusual_record_layouts)'"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        id: toolchain
        with:
          components: miri, rust-src
      - uses: Swatinem/rust-cache@v2
      # The sysroot depends on the compiler, not on the crate's feature set.
      # An exact key prevents reusing it across nightly compiler versions.
      - uses: actions/cache@v6
        id: miri-cache
        with:
          path: ${{ env.MIRI_SYSROOT }}
          key: miri-sysroot-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.cachekey }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.151
      # Miri's freshness check hashes rust-src mtimes, which change on fresh
      # installs. MIRI_SYSROOT lets tests use the exact compiler-keyed cache
      # directly instead of rebuilding it after a successful restore.
      - run: cargo miri setup
        if: steps.miri-cache.outputs.cache-hit != 'true'
      # Each test gets its own interpreter so the runner's cores can be used.
      - run: cargo miri nextest run -p tessera-sort ${{ matrix.args }} ${{ matrix.filter }}
      # Nextest does not run doctests.
      - run: cargo miri test -p tessera-sort --doc ${{ matrix.args }}

  asan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release --target x86_64-unknown-linux-gnu --workspace --all-targets
        env:
          RUSTFLAGS: -Zsanitizer=address
      - run: cargo test --release --target x86_64-unknown-linux-gnu --workspace --all-targets --all-features
        env:
          RUSTFLAGS: -Zsanitizer=address

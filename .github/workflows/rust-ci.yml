name: Rust CI

on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }}, ${{ matrix.toolchain }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
        # Keep the second entry in sync with `rust-version` in Cargo.toml.
        toolchain: [stable, "1.85"]
    env:
      # Lints are enforced on stable by the lint job. Older compilers report
      # false positives, such as `unreachable_pub` on 1.85, so MSRV only has
      # to build and pass the tests.
      RUSTFLAGS: ${{ matrix.toolchain == 'stable' && '-D warnings' || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-targets
      - run: cargo test -p tessera-sort --all-targets --features rayon
      # Benchmark dependencies would otherwise enable the crate's std feature.
      - run: cargo test -p tessera-sort --all-targets --no-default-features
      - run: cargo test --workspace --doc --features tessera-sort/rayon
      # fearless_simd requires Rust 1.89; keep the default-feature MSRV at 1.85.
      - run: cargo test --workspace --all-targets --all-features
        if: matrix.toolchain == 'stable'
      - run: cargo test --workspace --doc --all-features
        if: matrix.toolchain == 'stable'

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo clippy --workspace --all-targets --all-features
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Test the portable-simd MSRV
        run: |
          rustup toolchain install 1.89 --profile minimal
          cargo +1.89 test -p tessera-sort --all-targets --all-features
        env:
          # Stable above enforces lints; the feature MSRV checks compatibility.
          RUSTFLAGS: ""

  # This target has no `std` to link accidentally. Behavioral tests run in the
  # host matrix above, including MSRV; clippy also checks the no-std code path.
  no_std:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabi
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p tessera-sort --no-default-features --target thumbv7em-none-eabi
      - run: cargo clippy -p tessera-sort --no-default-features --all-targets

  miri:
    name: miri (${{ matrix.features }})
    runs-on: ubuntu-latest
    env:
      MIRI_SYSROOT: ${{ github.workspace }}/.miri-sysroot
    strategy:
      fail-fast: false
      matrix:
        include:
          - features: std
            args: ""
          - features: no-std
            args: --no-default-features
          - features: portable-simd
            args: --features portable-simd
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        id: toolchain
        with:
          components: miri, rust-src
      - uses: Swatinem/rust-cache@v2
      # The sysroot depends on the compiler, not on the crate's feature set.
      # An exact key prevents reusing it across nightly compiler versions.
      - uses: actions/cache@v5
        id: miri-cache
        with:
          path: ${{ env.MIRI_SYSROOT }}
          key: miri-sysroot-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.cachekey }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.151
      # Miri's freshness check hashes rust-src mtimes, which change on fresh
      # installs. MIRI_SYSROOT lets tests use the exact compiler-keyed cache
      # directly instead of rebuilding it after a successful restore.
      - run: cargo miri setup
        if: steps.miri-cache.outputs.cache-hit != 'true'
      # Each test gets its own interpreter so the runner's cores can be used.
      - run: cargo miri nextest run -p tessera-sort ${{ matrix.args }}
      # Nextest does not run doctests.
      - run: cargo miri test -p tessera-sort --doc ${{ matrix.args }}

  asan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release --target x86_64-unknown-linux-gnu --workspace --all-targets
        env:
          RUSTFLAGS: -Zsanitizer=address
      - run: cargo test --release --target x86_64-unknown-linux-gnu --workspace --all-targets --all-features
        env:
          RUSTFLAGS: -Zsanitizer=address

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo package -p tessera-sort

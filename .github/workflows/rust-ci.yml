name: Rust CI

on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # The check name defaults to the job id plus the matrix values. A skipped job
  # never expands its matrix, so an explicit `name:` would surface as the raw
  # template; the default name shows only `test-other-platforms`.
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            toolchain: stable
          # Keep every 1.89 cell in sync with `rust-version` in Cargo.toml.
          - os: ubuntu-latest
            toolchain: "1.89"
          - os: macos-latest
            toolchain: stable
          - os: windows-latest
            toolchain: stable
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust-test
        with:
          toolchain: ${{ matrix.toolchain }}

  # A pull request validates one cell per operating system and the MSRV on
  # Linux. The remaining cells run on main, which no pull request waits for.
  test-other-platforms:
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04-arm
            toolchain: stable
          - os: ubuntu-24.04-arm
            toolchain: "1.89"
          - os: macos-latest
            toolchain: "1.89"
          - os: windows-latest
            toolchain: "1.89"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust-test
        with:
          toolchain: ${{ matrix.toolchain }}

  lint:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      # Check every Rust feature, including the native FFI, without building
      # foreign libraries. The comparison job compiles, links and tests those.
      - run: cargo clippy --workspace --all-targets --all-features
        env:
          TESSERA_BENCH_CHECK_ONLY: "1"
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
          TESSERA_BENCH_CHECK_ONLY: "1"
      - run: cargo package -p tessera-sort

  comparison:
    runs-on: ubuntu-latest
    env:
      TESSERA_BENCH_TARGET_DIR: ${{ github.workspace }}/target/comparison
      # Match the CLI before testing so release builds can be reused unchanged.
      RUSTFLAGS: -C llvm-args=-align-loops=64 -C llvm-args=-align-all-nofallthru-blocks=6
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target/comparison"
          shared-key: comparison
      - name: Install native benchmark tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang libtbb-dev
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm tools check --native --out bench/results/ci
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: comparison-check-log
          path: bench/results/ci.log
          if-no-files-found: ignore

  miri:
    name: miri
    runs-on: ubuntu-latest
    env:
      MIRI_SYSROOT: ${{ github.workspace }}/.miri-sysroot
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        id: toolchain
        with:
          components: miri, rust-src
      - uses: Swatinem/rust-cache@v2
      # The sysroot depends on the compiler, not on the crate's feature set.
      # An exact key prevents reusing it across nightly compiler versions.
      - uses: actions/cache@v6
        id: miri-cache
        with:
          path: ${{ env.MIRI_SYSROOT }}
          key: miri-sysroot-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.cachekey }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.151
      # Miri's freshness check hashes rust-src mtimes, which change on fresh
      # installs. MIRI_SYSROOT lets tests use the exact compiler-keyed cache
      # directly instead of rebuilding it after a successful restore.
      - run: cargo miri setup
        if: steps.miri-cache.outputs.cache-hit != 'true'
      # Each test gets its own interpreter so the runner's cores can be used.
      - run: cargo miri nextest run -p tessera-sort
      # Sequential ownership fixtures cover the optional Rayon storage paths;
      # native pool tests cover scheduling, which these Miri fixtures do not.
      - run: >-
          cargo miri nextest run -p tessera-sort --features rayon
          -E 'test(block::parallel::) | test(engine::parallel::bucket_borrow_tests::)'
      - run: cargo miri test -p tessera-sort --doc --features rayon
      # Nextest does not run doctests.
      - run: cargo miri test -p tessera-sort --doc

  asan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release --target x86_64-unknown-linux-gnu --workspace --all-targets
        env:
          RUSTFLAGS: -Zsanitizer=address
      - run: cargo test --release --target x86_64-unknown-linux-gnu --workspace --all-targets --features tessera-sort/rayon
        env:
          RUSTFLAGS: -Zsanitizer=address

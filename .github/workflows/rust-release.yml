name: Rust release

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/rust-ci.yml

  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Check tag against package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bun run tools release verify --tag "$RELEASE_TAG"
      - run: cargo publish --locked -p tessera-order --dry-run
      # Exchanges the job's OIDC token for a short-lived crates.io token, revoked after the job.
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - run: cargo publish --locked -p tessera-order
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      - name: Create Rust release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # A draft: an agent or maintainer writes the notes per RELEASING.md, then publishes it.
          gh release create "$RELEASE_TAG" target/package/tessera-order-*.crate --verify-tag --title "$RELEASE_TAG" --draft --notes 'Draft: write the notes per RELEASING.md.'

name: Rust release

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/rust-ci.yml

  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Check tag against package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bun run tools release verify --tag "$RELEASE_TAG"
      # Before publishing, so a tag without notes publishes nothing. Checkout may
      # leave only the commit, so fetch the annotated tag object explicitly.
      - name: Read release notes from the tag message
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git fetch --no-tags --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          bun run --silent tools release notes --tag "$RELEASE_TAG" > "$RUNNER_TEMP/release-notes.md"
      - run: cargo publish --locked -p tessera-order --dry-run
      # Exchanges the job's OIDC token for a short-lived crates.io token, revoked after the job.
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - run: cargo publish --locked -p tessera-order
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      # `cargo publish` keeps its archive in an internal directory; packaging the
      # same locked sources again writes the byte-identical file to target/package.
      - run: cargo package --locked -p tessera-order --no-verify
      - name: Create Rust release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" target/package/tessera-order-*.crate --verify-tag --title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md"

name: Rust release

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/rust-ci.yml

  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Check tag against package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, tomllib
          with open('rust/tessera-sort/Cargo.toml', 'rb') as f:
              package = tomllib.load(f)['package']
          assert os.environ['RELEASE_TAG'] == 'rust/v' + package['version'], 'tag/package version mismatch'
          assert package.get('publish') is not False, 'package is still marked unpublished'
          PY
      - run: cargo publish --locked -p tessera-sort --dry-run
      - run: cargo publish --locked -p tessera-sort
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Create Rust release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          printf 'Rust package release %s. See CHANGELOG.md and RELEASING.md at this tag.\n' "$RELEASE_TAG" > release-notes.md
          gh release create "$RELEASE_TAG" target/package/tessera-sort-*.crate --verify-tag --title "$RELEASE_TAG" --notes-file release-notes.md

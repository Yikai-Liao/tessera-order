[workspace]
members = ["rust/tessera-sort", "bench/rust"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "BSD-2-Clause"
repository = "https://github.com/Yikai-Liao/tessera-sort"
authors = ["Yikai Liao <lyk-boya@outlook.com>"]

[profile.bench]
debug = true

[workspace.lints.rust]
missing_docs = "warn"
unreachable_pub = "warn"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
doc_markdown = "warn"
missing_panics_doc = "warn"
missing_safety_doc = "warn"
too_long_first_doc_paragraph = "warn"
undocumented_unsafe_blocks = "warn"

schema = 1

pairedBlocks = { short = { count = 3, agreement = 3 }, extended = { count = 9, agreement = 8 } }
# Descending length floors; one budget per revision, not per outer repetition.
revisionSampling = [
  { min_len = 10000000, warm_ms = 1000, window_ms = 4000, samples = 20 },
  { min_len = 1000000, warm_ms = 1000, window_ms = 4000, samples = 40 },
  { min_len = 1, warm_ms = 500, window_ms = 1500, samples = 30 },
]

algorithms = [
  { id = "tessera", label = "Tessera", stable = true, family = "radix", adapter = "common" },
  { id = "tessera-baseline", label = "Tessera baseline A", stable = true, family = "radix", adapter = "revision" },
  { id = "tessera-baseline-copy", label = "Tessera baseline B", stable = true, family = "radix", adapter = "revision" },
  { id = "tessera-copy", label = "Tessera current B", stable = true, family = "radix", adapter = "revision" },
  { id = "std-stable", label = "slice::sort", stable = true, family = "comparison", adapter = "common" },
  { id = "radsort", label = "radsort", stable = true, family = "radix", adapter = "rust" },
  { id = "voracious", label = "voracious", stable = true, family = "radix", adapter = "rust" },
  { id = "glidesort", label = "glidesort", stable = true, family = "comparison", adapter = "rust" },
  { id = "glidesort-sqrt", label = "glidesort-sqrt", stable = true, family = "comparison", adapter = "rust", detail = "given Tessera's memory", description = "comparison sort with Tessera's memory" },
  { id = "std-unstable", label = "slice::sort_unstable", stable = false, family = "comparison", adapter = "rust" },
  { id = "rdst", label = "rdst", stable = false, family = "radix", adapter = "rust" },
  { id = "clausecker", label = "clausecker", stable = true, family = "radix", adapter = "native" },
  { id = "fluxsort", label = "fluxsort", stable = true, family = "comparison", adapter = "native" },

  { id = "tessera-par-8", label = "Tessera · 8 threads", stable = true, family = "radix", adapter = "tessera-par", threads = 8 },
  { id = "rayon-stable-1", label = "Rayon stable · 1 thread", stable = true, family = "comparison", adapter = "rayon-stable", threads = 1 },
  { id = "rayon-stable-2", label = "Rayon stable · 2 threads", stable = true, family = "comparison", adapter = "rayon-stable", threads = 2 },

modes = [
  { id = "api", label = "serial" },
  { id = "unstable", label = "unstable" },
  { id = "par", label = "parallel" },
  { id = "par-4", label = "parallel · 4 threads" },
  { id = "par_unstable", label = "parallel unstable" },
]

[continuous]
# One required SIMD backend; Cloud history lives under this Testbed.
testbed = "ci"
features = ["rayon"]

[comparison]
types = ["u32","u64","f64","row_u64","record128","owned","row_u32","reverse_u64","reverse_f64"]
shapes = ["random","d256","d16","zipf1.1","zipf2","skew99","sorted","reverse","sorted99","runs","equal","d4096","two_values","hot50","sparse8","sparse_digits","bimodal","far_swaps","finite_signed","sorted_tail"]
# Fixed cross-type aggregates; targeted inputs are plotted separately.
summaryShapes = ["random","d256","d16","zipf1.1","zipf2","skew99","sorted","reverse","sorted99","runs"]
lengths = [1000,65536,1000000,10000000]
typeGroups = [
  { title = "Keys · against any sort", keys = true, types = ["u32","u64","f64"] },
  { title = "Records · against stable sorts", keys = false, types = ["row_u32","row_u64","record128","owned"] },
]

[smoke]
types = ["u32","u64","u128","f64","row_u32","row_u64","rec128_u64"]
shapes = ["random","d256","d16","zipf1.1","zipf2","skew99","sorted","reverse","sorted99","runs","equal","d4096","two_values","hot50","sparse8","sparse_digits","bimodal","far_swaps","finite_signed","sorted_tail"]
lengths = [1000,65536,1000000,10000000]

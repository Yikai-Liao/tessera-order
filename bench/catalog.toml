  { id = "f64", label = "f64", detail = "total order", task = "keys", bytes = 8 },
  { id = "reverse_u64", label = "Reverse<u64>", detail = "descending direct key", task = "keys", bytes = 8 },
  { id = "reverse_f64", label = "Reverse<f64>", detail = "descending total order", task = "keys", bytes = 8 },
  { id = "row_u64", label = "{u64, u32}", detail = "16-byte row", task = "records", compact = "{u64,u32}", bytes = 16 },

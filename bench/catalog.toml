schema = 2

pairedBlocks = { short = { count = 3, agreement = 3 }, extended = { count = 9, agreement = 8 } }
# Descending length floors; one budget per revision, not per outer repetition.
revisionSampling = [
  { min_len = 10000000, warm_ms = 1000, window_ms = 4000, samples = 20 },
  { min_len = 1000000, warm_ms = 1000, window_ms = 4000, samples = 40 },
  { min_len = 1, warm_ms = 500, window_ms = 1500, samples = 30 },
]

# `parallel` marks a parallel full-sort entry point, beside the serial one ("also") or
# instead of it ("only"); other implementations and operations are serial. `routes` names,
# per operation, the call a non-sort case makes when the label alone would misname it; figures
# show it beside the label.
implementations = [
  { id = "tessera", label = "Tessera", stable = true, family = "radix", adapter = "common", parallel = "also", routes = { partition-buckets = "sort_by_cached_key" } },
  # A selection or category comparison measures Tessera's dedicated route and its full sort on the same case.
  { id = "tessera-full", label = "Tessera sort", stable = true, family = "radix", adapter = "reference", detail = "full sort as a composition reference", description = "full-sort reference for required ranks or stable category grouping" },
  { id = "tessera-baseline", label = "Tessera baseline A", stable = true, family = "radix", adapter = "revision" },
  { id = "tessera-baseline-copy", label = "Tessera baseline B", stable = true, family = "radix", adapter = "revision" },
  { id = "tessera-copy", label = "Tessera current B", stable = true, family = "radix", adapter = "revision" },
  { id = "std-stable", label = "slice::sort", stable = true, family = "comparison", adapter = "common", routes = { argsort = "sort_by on indices", select_nth = "full sort", partition-buckets = "sort_by_key on categories" } },
  { id = "radsort", label = "radsort", stable = true, family = "radix", adapter = "rust", routes = { argsort = "sort_by_key on indices", select_nth = "full sort", partition-buckets = "sort_by_key on categories" } },
  { id = "voracious", label = "voracious", stable = true, family = "radix", adapter = "rust" },
  { id = "glidesort", label = "glidesort", stable = true, family = "comparison", adapter = "rust", routes = { argsort = "sort_by on indices", select_nth = "full sort", partition-buckets = "sort_by on categories" } },
  { id = "glidesort-sqrt", label = "glidesort-sqrt", stable = true, family = "comparison", adapter = "rust", detail = "given Tessera's memory", description = "comparison sort with Tessera's memory" },
  { id = "std-unstable", label = "slice::sort_unstable", stable = false, family = "comparison", adapter = "rust", routes = { argsort = "sort_unstable_by on indices, index tie-break", select_nth = "select_nth_unstable" } },
  { id = "rdst", label = "rdst", stable = false, family = "radix", adapter = "rust" },
  { id = "clausecker", label = "Block LSD*", stable = true, family = "radix", adapter = "native", detail = "*Clausecker & Schintke's original C code", description = "Clausecker and Schintke's original C implementation; 32-bit-key rows only, no generic adapters" },
  { id = "fluxsort", label = "fluxsort", stable = true, family = "comparison", adapter = "native" },
  { id = "ips2ra", label = "ips2ra", stable = false, family = "radix", adapter = "native" },
  { id = "ips4o", label = "ips4o", stable = false, family = "comparison", adapter = "native" },
  { id = "vqsort", label = "vqsort", stable = false, family = "SIMD", adapter = "native" },
  { id = "x86simdsort", label = "x86simdsort", stable = false, family = "SIMD", adapter = "native" },
  { id = "crumsort", label = "crumsort", stable = false, family = "comparison", adapter = "native" },
  { id = "duckdb", label = "DuckDB 1.4.0 kernel", stable = false, family = "radix", adapter = "native", detail = "Vergesort + Ska + pdqsort", description = "single-threaded raw-key kernel; no SQL encoding or external merge" },
  { id = "rayon-stable", label = "Rayon stable", stable = true, family = "comparison", adapter = "rayon", parallel = "only" },
]


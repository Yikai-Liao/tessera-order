  { id = "sorted99", label = "99% sorted", group = "Presorted" },
  { id = "runs", label = "sorted runs", compact = "runs", group = "Presorted" },
  { id = "equal", label = "all equal", group = "Few distinct keys" },
  { id = "d4096", label = "4,096 values", group = "Few distinct keys" },
  { id = "sorted95", label = "95% sorted" },
  { id = "skew50", label = "50% one key" },
  { id = "two_values", label = "two values", group = "Few distinct keys" },
  { id = "hot50", label = "50% one key, rest random", group = "Skewed" },
  { id = "sparse8", label = "8 wide keys", group = "Few distinct keys" },
  { id = "sparse_digits", label = "sparse digits", group = "Key structure" },
  { id = "bimodal", label = "two clusters", group = "Key structure" },
  { id = "far_swaps", label = "1% far swaps", group = "Presorted" },
  { id = "finite_signed", label = "finite floats", group = "Finite floats" },

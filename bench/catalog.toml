[continuous]
# One required SIMD backend; Cloud history lives under this Testbed.
testbed = "ci"
# The continuous plan's parallel and operation cases select these harness features.
features = ["operations", "rayon"]

[inputs]
lengths = [1000,65536,1000000,10000000]

# Operations in report section order. `label` names the serial entry point and
# `parallel_label` the parallel one, where the library has it; parameters are
# integers, in identity order, shown with their optional label. `reference` is
# the implementation whose serial column is the speed denominator: what a Rust
# user writes today with the standard library for the same result.
# `parallel_reference` is the denominator at each pool size. `noun` names one call in
# figure text: "Fastest of 4 selections".
[[operations]]
id = "sort"
label = "sort"
noun = "sort"
parallel_label = "par_sort"
reference = "std-stable"
parallel_reference = "rayon-stable"
description = "Full sort"
# Release report types and baseline patterns; independent of input generation and adapter support.
# Fixed cross-type aggregates; targeted inputs are plotted separately.
comparison = { types = ["u32","u64","f64","row_u64","record128","owned","row_u32","reverse_u64","reverse_f64"], summaryDistributions = ["random","d256","d16","zipf1.1","zipf2","skew99","sorted","reverse","sorted99","runs"] }

[[operations]]
id = "argsort"
label = "argsort"
noun = "argsort"
reference = "std-stable"
description = "Stable argsort"

[[operations]]
id = "select_nth"
label = "select_nth"
noun = "selection"
reference = "std-unstable"
description = "Stable selection"
parameters = [{ id = "index", label = "rank" }]

[[operations]]
id = "partition-buckets"
label = "categories"
noun = "partition"
reference = "std-stable"
description = "Stable partition into categories"
parameters = [{ id = "bucket_count" }]

# SPDX-License-Identifier: BSD-2-Clause

schema = 1
harness = "smoke"
algorithms = [ "tessera" ]
exclude = []

# Small random inputs exercise parallel-entry overhead and serial fallback;
# million-record inputs exercise root scatter and bucket scheduling.
[[parallel]]
types = [ "u32", "row_u32", "u64", "row_u64" ]
distributions = [ "random" ]
lengths = [ 65536 ]

[[parallel]]
types = [ "u32", "u64", "u128", "f64", "row_u32", "row_u64", "rec128_u64" ]
distributions = [ "random" ]
lengths = [ 1000000 ]

[[parallel]]
types = [ "u64" ]
distributions = [ "sorted", "reverse", "sorted99", "equal", "far_swaps", "d16", "d4096", "sparse_digits", "zipf2", "skew99", "two_values", "sorted_tail", "runs", "bimodal" ]
lengths = [ 1000000 ]

# Roots of at least 2^21 records reach bounded staging and its block scale;
# a balanced key and skewed keyed rows cover both final-band routes.
[[parallel]]
types = [ "u64" ]
distributions = [ "random" ]
lengths = [ 4194304 ]

[[parallel]]
types = [ "row_u64" ]
distributions = [ "skew99" ]
lengths = [ 4194304 ]

# Keyed rows retain payload stability across fast paths and uneven buckets.
[[parallel]]
types = [ "row_u64" ]
distributions = [ "sorted", "reverse", "equal", "d16", "hot50", "skew99", "sorted_tail" ]
lengths = [ 1000000 ]

[[parallel]]
types = [ "row_u32" ]
distributions = [ "skew99" ]
lengths = [ 1000000 ]

[[parallel]]
types = [ "u128" ]
distributions = [ "sparse8" ]
lengths = [ 1000000 ]

[[parallel]]
types = [ "f64" ]
distributions = [ "finite_signed" ]
lengths = [ 1000000 ]

[[parallel]]
types = [ "rec128_u64" ]
distributions = [ "sparse_digits" ]
lengths = [ 1000000 ]

[[include]]
types = [ "u64", "row_u64" ]
distributions = [ "random", "sorted", "reverse", "equal" ]
lengths = [ "insertion-max" ]

[[include]]
types = [ "u64" ]
distributions = [ "random" ]
lengths = [ "insertion-next", "tile-next" ]

[[include]]
types = [ "row_u32" ]
distributions = [ "random" ]
lengths = [ "insertion-next", "tile-next" ]

[[include]]
types = [ "row_u64" ]
distributions = [ "random" ]
lengths = [ "tile-next" ]

[[include]]
types = [ "u64", "u32", "f64", "row_u64" ]
distributions = [ "sorted", "reverse" ]
lengths = [ 1000 ]

[[include]]
types = [ "u64" ]
distributions = [ "equal" ]
lengths = [ 1000 ]

[[include]]
types = [ "u64", "row_u64" ]
distributions = [ "random", "skew99" ]
lengths = [ 1000 ]

[[include]]
types = [ "u64" ]
distributions = [ "random" ]
lengths = [ 65536 ]

[[include]]
types = [ "u64" ]
# Specialized direct-key shapes stay at 65k to leave room for the parallel tail.
distributions = [ "sorted", "reverse", "sorted99", "equal", "far_swaps", "d16", "d4096", "sparse_digits", "zipf2", "skew99", "two_values", "sorted_tail", "runs" ]
lengths = [ 65536 ]

[[include]]
types = [ "u32" ]
distributions = [ "random", "sorted", "sorted99" ]
lengths = [ 65536 ]

[[include]]
types = [ "u128" ]
distributions = [ "random" ]
lengths = [ 65536 ]

[[include]]
types = [ "f64" ]
distributions = [ "random", "sorted", "sorted99", "finite_signed" ]
lengths = [ 65536 ]

[[include]]
types = [ "row_u64" ]
distributions = [ "random" ]
lengths = [ 65536 ]

[[include]]
types = [ "row_u64" ]
distributions = [ "d16", "hot50", "sorted_tail" ]
lengths = [ 65536 ]

[[include]]
types = [ "rec128_u64" ]
distributions = [ "random" ]
lengths = [ 65536 ]

[[include]]
types = [ "rec128_u64" ]
distributions = [ "sparse_digits" ]
lengths = [ 65536 ]

[[include]]
types = [ "u64" ]
distributions = [ "random", "bimodal", "sorted_tail" ]
lengths = [ 1000000 ]


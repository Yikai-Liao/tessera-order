# SPDX-License-Identifier: BSD-2-Clause

schema = 1
harness = "smoke"
algorithms = [ "tessera" ]
exclude = []

[[parallel]]
types = ["u32", "row_u32", "u64", "row_u64"]
distributions = ["random"]
lengths = [10000000]

[[parallel]]
types = ["u64"]
distributions = ["sorted", "reverse", "equal"]
lengths = [10000000]

[[parallel]]
types = ["row_u32"]
distributions = ["skew99"]
lengths = [10000000]

[[include]]
types = [ "u64", "row_u64" ]
distributions = [ "random", "sorted", "reverse", "equal" ]
lengths = [ "insertion-max" ]

[[include]]
types = [ "u64" ]
distributions = [ "random" ]
lengths = [ "insertion-next", "tile-next" ]

[[include]]
types = [ "row_u32" ]
distributions = [ "random" ]
lengths = [ "insertion-next", "tile-next" ]

[[include]]
types = [ "row_u64" ]
distributions = [ "random" ]
lengths = [ "tile-next" ]

[[include]]
types = [ "u64", "u32", "f64", "row_u64" ]
distributions = [ "sorted", "reverse" ]
lengths = [ 1000 ]

[[include]]
types = [ "u64" ]
distributions = [ "equal" ]
lengths = [ 1000 ]

[[include]]
types = [ "u64", "row_u64" ]
distributions = [ "random", "skew99" ]
lengths = [ 1000 ]

[[include]]
types = [ "u64" ]
distributions = [ "random" ]
lengths = [ 65536 ]

[[include]]
types = [ "u64" ]
# Specialized direct-key shapes stay at 65k to leave room for the parallel tail.
distributions = [ "sorted", "reverse", "sorted99", "equal", "far_swaps", "d16", "d4096", "sparse_digits", "zipf2", "skew99", "sorted_tail", "runs" ]
lengths = [ 65536 ]

[[include]]
types = [ "u32" ]
distributions = [ "random", "sorted", "sorted99" ]
lengths = [ 65536 ]

[[include]]
types = [ "u128" ]
distributions = [ "random" ]
lengths = [ 65536 ]

[[include]]
types = [ "f64" ]
distributions = [ "random", "sorted", "sorted99", "finite_signed" ]
lengths = [ 65536 ]

[[include]]
types = [ "row_u64" ]
distributions = [ "random" ]
lengths = [ 65536 ]

[[include]]
types = [ "row_u64" ]
distributions = [ "d16", "hot50" ]
lengths = [ 65536 ]

[[include]]
types = [ "rec128_u64" ]
distributions = [ "random" ]
lengths = [ 65536 ]

[[include]]
types = [ "rec128_u64" ]
distributions = [ "sparse_digits" ]
lengths = [ 65536 ]

[[include]]
types = [ "u64" ]
distributions = [ "random", "skew99", "two_values", "bimodal" ]
lengths = [ 1000000 ]

[[include]]
types = [ "u32", "row_u64" ]
distributions = [ "random" ]
lengths = [ 1000000 ]

[[include]]
types = [ "u128" ]
distributions = [ "random", "sparse8" ]
lengths = [ 1000000 ]

[[include]]
types = [ "u64" ]
distributions = [ "random" ]
lengths = [ 10000000 ]

# SPDX-License-Identifier: BSD-2-Clause

schema = 3
implementations = [ "tessera" ]
exclude = []

# Small random inputs exercise parallel-entry overhead and serial fallback;
# million-record inputs exercise root scatter and bucket scheduling.
[[include]]
types = [ "u32", "row_u32", "u64", "row_u64" ]
distributions = [ "random" ]
lengths = [ 65536 ]
executions = [ "t4" ]

[[include]]
types = [ "u32", "u64", "u128", "f64", "row_u32", "row_u64", "rec128_u64" ]
distributions = [ "random" ]
lengths = [ 1000000 ]
executions = [ "t4" ]

[[include]]
types = [ "u64" ]
distributions = [ "sorted", "reverse", "sorted99", "equal", "far_swaps", "d16", "d4096", "sparse_digits", "zipf2", "skew99", "two_values", "sorted_tail", "runs", "bimodal" ]
lengths = [ 1000000 ]
executions = [ "t4" ]

# Keyed rows retain payload stability across fast paths and uneven buckets.
[[include]]
types = [ "row_u64" ]
distributions = [ "sorted", "reverse", "equal", "d16", "hot50", "skew99", "sorted_tail" ]
lengths = [ 1000000 ]
executions = [ "t4" ]

[[include]]
types = [ "row_u32" ]
distributions = [ "skew99" ]
lengths = [ 1000000 ]
executions = [ "t4" ]

[[include]]
types = [ "u128" ]
distributions = [ "sparse8" ]
lengths = [ 1000000 ]
executions = [ "t4" ]

[[include]]
types = [ "f64" ]
distributions = [ "finite_signed" ]
lengths = [ 1000000 ]
executions = [ "t4" ]

[[include]]
types = [ "rec128_u64" ]
distributions = [ "sparse_digits" ]
lengths = [ 1000000 ]
executions = [ "t4" ]

[[include]]
types = [ "u64", "row_u64" ]
distributions = [ "random", "sorted", "reverse", "equal" ]
lengths = [ "insertion-max" ]

[[include]]
types = [ "u64" ]
distributions = [ "random" ]
lengths = [ "insertion-next", "tile-next" ]

[[include]]
types = [ "row_u32" ]
distributions = [ "random" ]
lengths = [ "insertion-next", "tile-next" ]

[[include]]
types = [ "row_u64" ]
distributions = [ "random" ]
lengths = [ "tile-next" ]

[[include]]
types = [ "u64", "u32", "f64", "row_u64" ]
distributions = [ "sorted", "reverse" ]
lengths = [ 1000 ]

[[include]]
types = [ "u64" ]
distributions = [ "equal" ]
lengths = [ 1000 ]

[[include]]
types = [ "u64", "row_u64" ]
distributions = [ "random", "skew99" ]
lengths = [ 1000 ]

[[include]]
types = [ "u64" ]
distributions = [ "random" ]
lengths = [ 65536 ]

[[include]]
types = [ "u64" ]
# Specialized direct-key distributions stay at 65k to leave room for the t4 tail.
distributions = [ "sorted", "reverse", "sorted99", "equal", "far_swaps", "d16", "d4096", "sparse_digits", "zipf2", "skew99", "two_values", "sorted_tail", "runs" ]
lengths = [ 65536 ]

[[include]]
types = [ "u32" ]
distributions = [ "random", "sorted", "sorted99" ]
lengths = [ 65536 ]

[[include]]
types = [ "u128" ]
distributions = [ "random" ]
lengths = [ 65536 ]

[[include]]
types = [ "f64" ]
distributions = [ "random", "sorted", "sorted99", "finite_signed" ]
lengths = [ 65536 ]

[[include]]
types = [ "row_u64" ]
distributions = [ "random" ]
lengths = [ 65536 ]

[[include]]
types = [ "row_u64" ]
distributions = [ "d16", "hot50", "sorted_tail" ]
lengths = [ 65536 ]

[[include]]
types = [ "rec128_u64" ]
distributions = [ "random" ]
lengths = [ 65536 ]

[[include]]
types = [ "rec128_u64" ]
distributions = [ "sparse_digits" ]
lengths = [ 65536 ]

[[include]]
types = [ "u64" ]
distributions = [ "random", "bimodal", "sorted_tail" ]
lengths = [ 1000000 ]

[[include]]
types = [ "u32", "row_u32", "row_u64" ]
distributions = [ "random" ]
lengths = [ 1000000 ]

[[include]]
types = [ "u128" ]
distributions = [ "random", "sparse8" ]
lengths = [ 1000000 ]

# Random direct-key and keyed-record cases guard each admitted non-sort call.
[[include]]
types = [ "u64", "row_u64" ]
distributions = [ "random" ]
lengths = [ 65536 ]
operation = { kind = "argsort" }

[[include]]
types = [ "u64", "row_u64" ]
distributions = [ "random" ]
lengths = [ 65536 ]
operation = { kind = "partition-buckets", bucket_count = 16 }

[[include]]
types = [ "u64", "row_u64" ]
distributions = [ "random" ]
lengths = [ 65536 ]
operation = { kind = "select_nth", index = 32768 }

# The wider category range exercises the cached-key index-permutation fallback.
[[include]]
types = [ "u64", "row_u64" ]
distributions = [ "random" ]
lengths = [ 65536 ]
operation = { kind = "partition-buckets", bucket_count = 65537 }

# Duplicate keys exercise stable index order and exact rank membership.
[[include]]
types = [ "row_u64" ]
distributions = [ "d16" ]
lengths = [ 65536 ]
operation = { kind = "argsort" }

[[include]]
types = [ "row_u64" ]
distributions = [ "d16" ]
lengths = [ 65536 ]
operation = { kind = "select_nth", index = 32768 }

# Endpoints exercise one-rank placement on wide records and on ties.
[[include]]
types = [ "rec128_u64" ]
distributions = [ "random" ]
lengths = [ 65536 ]
operation = { kind = "select_nth", index = 0 }

[[include]]
types = [ "rec128_u64" ]
distributions = [ "random" ]
lengths = [ 65536 ]
operation = { kind = "select_nth", index = 65535 }

[[include]]
types = [ "row_u64" ]
distributions = [ "d16" ]
lengths = [ 65536 ]
operation = { kind = "select_nth", index = 0 }

[[include]]
types = [ "row_u64" ]
distributions = [ "d16" ]
lengths = [ 65536 ]
operation = { kind = "select_nth", index = 65535 }

# Longer index lists pack a key prefix beside each index. One million-record
# case guards the packed bands without doubling the long serial phase.
[[include]]
types = [ "u64" ]
distributions = [ "random" ]
lengths = [ 1000000 ]
operation = { kind = "argsort" }

# Ranks near an end finish from bounded cuts instead of radix passes.
[[include]]
types = [ "u64", "row_u64" ]
distributions = [ "random" ]
lengths = [ 65536 ]
operation = { kind = "select_nth", index = 4 }

# Nearly ordered inputs exercise source-order spans for full sorts and
# argsort; selection must keep its radix passes there.
[[include]]
types = [ "u64" ]
distributions = [ "far_swaps" ]
lengths = [ 65536 ]
operation = { kind = "argsort" }

[[include]]
types = [ "u64", "rec128_u64" ]
distributions = [ "far_swaps" ]
lengths = [ 65536 ]
operation = { kind = "select_nth", index = 32768 }

# Wide records change the exception budget for source-order spans.
[[include]]
types = [ "rec128_u64" ]
distributions = [ "far_swaps" ]
lengths = [ 65536 ]

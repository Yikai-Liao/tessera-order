schema = 1
algorithms = [ "tessera", "std-stable", "radsort", "voracious", "glidesort", "glidesort-sqrt", "std-unstable", "rdst", "clausecker", "fluxsort", "ips2ra", "ips4o", "vqsort", "x86simdsort", "crumsort", "duckdb" ]

# Keep the original cross-type matrix for comparable aggregate figures.
[[include]]
types = [ "u32", "u64", "f64", "row_u64", "record128", "owned", "row_u32" ]
distributions = [ "random", "d256", "d16", "zipf1.1", "zipf2", "skew99", "sorted", "reverse", "sorted99", "runs" ]

# Cardinality, skew and disorder are distinct axes, shared by every record type.
[[include]]
types = [ "u32", "u64", "f64", "row_u64", "record128", "owned", "row_u32" ]
distributions = [ "equal", "d4096", "two_values", "hot50", "far_swaps", "sorted_tail" ]
lengths = [ 65536, 1000000 ]

# Full-width low cardinality, without float encodings changing the key geometry.
[[include]]
types = [ "u32", "u64", "row_u32", "row_u64" ]
distributions = [ "sparse8" ]
lengths = [ 65536, 1000000 ]

# These generators use a 64-bit mask and a cluster bit at position 63.
[[include]]
types = [ "u64", "row_u64", "record128", "owned" ]
distributions = [ "sparse_digits", "bimodal" ]
lengths = [ 65536, 1000000 ]

[[include]]
types = [ "f64" ]
distributions = [ "finite_signed" ]

# Check large-input scaling without multiplying every new shape by every type.
[[include]]
types = [ "u64" ]
distributions = [ "equal", "d4096", "two_values", "hot50", "sparse8", "sparse_digits", "bimodal", "far_swaps", "sorted_tail" ]
lengths = [ 10000000 ]

[[exclude]]
types = [ "record128", "owned" ]
lengths = [ 10000000 ]

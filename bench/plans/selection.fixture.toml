[plan]
schema = 1
harness = "smoke"
algorithms = [ "tessera" ]

[[plan.include]]
types = [ "u64", "row_u64" ]
distributions = [ "random", "zipf2" ]
lengths = [ 1000, 65536 ]

[[plan.include]]
types = [ "f64" ]
distributions = [ "sorted" ]
modes = [ "api" ]

[[plan.exclude]]
types = [ "row_u64" ]
distributions = [ "zipf2" ]

[[plan.exclude]]
lengths = [ 1000 ]
modes = [ "api" ]

[[cases]]
type = "u64"
distribution = "random"
length = 65536
mode = "api"
selected = true


# SPDX-License-Identifier: BSD-2-Clause
#
# The shared contract that the TS (catalog.ts, plan.ts) and Rust (plan.rs)
# formatters, decoders and selectors check independently.

[plan]
schema = 3
implementations = [ "tessera", "rayon-stable" ]

[[plan.include]]
types = [ "u64", "row_u64" ]
distributions = [ "random", "zipf2" ]
lengths = [ 1000, 65536 ]
executions = [ "serial", "t4" ]

[[plan.include]]
types = [ "f64" ]
distributions = [ "sorted" ]

[[plan.include]]
types = [ "u64" ]
distributions = [ "random" ]
lengths = [ 65536 ]
operation = { kind = "select_nth", index = 7 }

[[plan.exclude]]
types = [ "row_u64" ]
distributions = [ "zipf2" ]

[[plan.exclude]]
lengths = [ 1000 ]

[[plan.exclude]]
types = [ "row_u64" ]
executions = [ "t4" ]

# Absent operation means sort; absent execution means serial. A rule without
# lengths selects the catalog default lengths.
[[cases]]
type = "u64"
distribution = "random"
length = 65536
selected = true

[[cases]]
type = "u64"
distribution = "random"
length = 65536
execution = "t4"
selected = true

[[cases]]
type = "u64"
distribution = "random"
length = 65536
execution = "t1"
selected = false

[[cases]]
type = "u64"
distribution = "zipf2"
length = 65536
selected = true

[[cases]]
type = "u64"
distribution = "random"
length = 1000
selected = false

[[cases]]
type = "row_u64"
distribution = "zipf2"
length = 65536
selected = false

[[cases]]
type = "row_u64"
distribution = "random"
length = 65536
selected = true

[[cases]]
type = "row_u64"
distribution = "random"
length = 65536
execution = "t4"
selected = false

[[cases]]
type = "f64"
distribution = "sorted"
length = 65536
selected = true

[[cases]]
type = "f64"
distribution = "sorted"
length = 65536
execution = "t4"
selected = false

[[cases]]
type = "f64"
distribution = "reverse"
length = 65536
selected = false

[[cases]]
type = "u64"
distribution = "random"
length = 1234
selected = false

[[cases]]
type = "u32"
distribution = "random"
length = 65536
selected = false

[[cases]]
type = "u64"
distribution = "random"
length = 65536
operation = { kind = "select_nth", index = 7 }
selected = true

[[cases]]
type = "u64"
distribution = "random"
length = 65536
operation = { kind = "select_nth", index = 8 }
selected = false

[[cases]]
type = "u64"
distribution = "random"
length = 65536
operation = { kind = "argsort" }
selected = false

# Independent formatting examples; every ID decodes back to its parts.
[[identities]]
case = { type = "u64", distribution = "random", length = 65536, operation = { kind = "sort" } }
column = { implementation = "tessera", execution = "serial" }
case_id = "sort/u64/random/65536/s1"
group = "sort/u64/random"
column_id = "tessera/serial"
criterion = "rust/sort/u64/random/65536/s1/serial"

[[identities]]
case = { type = "row_u64", distribution = "random", length = 1000000, operation = { kind = "sort" } }
column = { implementation = "rayon-stable", execution = "t4" }
case_id = "sort/row_u64/random/1000000/s1"
group = "sort/row_u64/random"
column_id = "rayon-stable/t4"
criterion = "rust/sort/row_u64/random/1000000/s1/t4"

[[identities]]
case = { type = "u64", distribution = "d16", length = 1000, operation = { kind = "argsort" } }
column = { implementation = "std-stable", execution = "serial" }
case_id = "argsort/u64/d16/1000/s1"
group = "argsort/u64/d16"
column_id = "std-stable/serial"
criterion = "rust/argsort/u64/d16/1000/s1/serial"

[[identities]]
case = { type = "u64", distribution = "random", length = 1000, operation = { kind = "select_nth", index = 999 } }
column = { implementation = "tessera", execution = "t1" }
case_id = "select_nth/u64/random/1000/s1/999"
group = "select_nth/u64/random/999"
column_id = "tessera/t1"
criterion = "rust/select_nth/u64/random/1000/s1/999/t1"

[[identities]]
case = { type = "u64", distribution = "random", length = 1000, operation = { kind = "partition-buckets", bucket_count = 7 } }
column = { implementation = "tessera", execution = "t16" }
case_id = "partition-buckets/u64/random/1000/s1/7"
group = "partition-buckets/u64/random/7"
column_id = "tessera/t16"
criterion = "rust/partition-buckets/u64/random/1000/s1/7/t16"

# Every decoder rejects noncanonical, unknown or out-of-range components.
[invalid]
executions = [ "", "t0", "t01", "T4", "t", "t-1", "t4x", "par-4", "api", "serial " ]
columns = [ "tessera", "tessera/", "unknown/serial", "tessera/t0", "tessera/serial/x", "/serial" ]
case_ids = [
  "u64/random/65536/s1",
  "sort/u64/random/65536/s2",
  "sort/u64/random/065536/s1",
  "sort/u64/random/0/s1",
  "sort/u65/random/1000/s1",
  "sort/u64/unknown/1000/s1",
  "sort/u64/random/1000/s1/3",
  "argsort/u64/random/1000/s1/3",
  "select/u64/random/1000/s1/3",
  "select_nth/u64/random/1000/s1",
  "select_nth/u64/random/1000/s1/1000",
  "select_nth/u64/random/1000/s1/01",
  "partition-buckets/u64/random/1000/s1/0",
  "top-k/u64/random/1000/s1/3",
]
criterion = [
  "sort/u64/random/1000/s1/serial",
  "rust/sort/u64/random/1000/s1",
  "rust/sort/u64/random/1000/s1/api",
  "rust/sort/u64/random/1000/s1/par-4",
  "rust/u64/random/1000/s1/serial",
]

# Operation grammar and bounds on one input; no case_id means rejection.
[operation_case]
type = "u64"
distribution = "random"
length = 1000

[[operations]]
operation = { kind = "sort" }
case_id = "sort/u64/random/1000/s1"

[[operations]]
operation = { kind = "argsort" }
case_id = "argsort/u64/random/1000/s1"

[[operations]]
operation = { kind = "select_nth", index = 0 }
case_id = "select_nth/u64/random/1000/s1/0"

[[operations]]
operation = { kind = "partition-buckets", bucket_count = 65537 }
case_id = "partition-buckets/u64/random/1000/s1/65537"

[[operations]]
operation = { kind = "partition-buckets", bucket_count = 0 }
[[operations]]
operation = { kind = "select_nth", index = 1000 }
[[operations]]
operation = { kind = "select_nth", index = -1 }
[[operations]]
operation = { kind = "select_nth" }
[[operations]]
operation = { kind = "select", index = 1 }
[[operations]]
operation = { kind = "partition" }
[[operations]]
operation = { kind = "top-k", k = 1 }
[[operations]]
operation = { kind = "argsort", unexpected = true }

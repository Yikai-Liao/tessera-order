# SPDX-License-Identifier: BSD-2-Clause

[plan]
schema = 1
algorithms = [ "tessera" ]

[[plan.include]]
types = [ "u64", "row_u64" ]
distributions = [ "random", "zipf2" ]
lengths = [ 1000, 65536 ]

[[plan.include]]
types = [ "f64" ]
distributions = [ "sorted" ]

[[plan.exclude]]
types = [ "row_u64" ]
distributions = [ "zipf2" ]

[[plan.exclude]]
lengths = [ 1000 ]

[[cases]]
type = "u64"
distribution = "random"
length = 65536
selected = true

[[cases]]
type = "u64"
distribution = "zipf2"
length = 65536
selected = true

[[cases]]
type = "u64"
distribution = "random"
length = 1000
selected = false

[[cases]]
type = "row_u64"
distribution = "zipf2"
length = 65536
selected = false

[[cases]]
type = "row_u64"
distribution = "random"
length = 65536
selected = true

[[cases]]
type = "f64"
distribution = "sorted"
length = 999
selected = true

[[cases]]
type = "f64"
distribution = "reverse"
length = 999
selected = false

[[cases]]
type = "u64"
distribution = "random"
length = 1234
selected = false

[[cases]]
type = "u64"
distribution = "reverse"
length = 65536
selected = false

[[cases]]
type = "u32"
distribution = "random"
length = 65536
selected = false

# Both language implementations check these independent formatting examples.
[[identities]]
type = "u64"
distribution = "random"
length = 65536
mode = "api"
comparison = "u64/random/65536/s1"
criterion_group = "rust/u64/random/65536/s1"
criterion = "rust/u64/random/65536/s1/api"

[[identities]]
type = "row_u64"
distribution = "random"
length = 1000000
mode = "par-4"
comparison = "row_u64/random/1000000/s1"
criterion_group = "rust/row_u64/random/1000000/s1"
criterion = "rust/row_u64/random/1000000/s1/par-4"

# Operation grammar, bounds and IDs are retained boundary copies in TS/Rust.
[operation_case]
ty = "u64"
distribution = "random"
len = 1000

[[operations]]
operation = { kind = "argsort" }
comparison = "u64/random/1000/s1/argsort"
group = "u64/random/argsort"

[[operations]]
operation = { kind = "segments", segment_len = 73 }
comparison = "u64/random/1000/s1/segments/73"
group = "u64/random/segments/73"

[[operations]]
operation = { kind = "top-k", k = 513 }
comparison = "u64/random/1000/s1/top-k/513"
group = "u64/random/top-k/513"

[[operations]]
operation = { kind = "prefix", prefix_len = 0 }
comparison = "u64/random/1000/s1/prefix/0"
group = "u64/random/prefix/0"

[[operations]]
operation = { kind = "select", index = 999 }
comparison = "u64/random/1000/s1/select/999"
group = "u64/random/select/999"

[[operations]]
operation = { kind = "rank-range", start = 20, end = 20 }
comparison = "u64/random/1000/s1/rank-range/20-20"
group = "u64/random/rank-range/20-20"

[[operations]]
operation = { kind = "select-many", indices = [999, 0, 999] }
comparison = "u64/random/1000/s1/select-many/999,0,999"
group = "u64/random/select-many/999,0,999"

[[operations]]
operation = { kind = "select-many", indices = [] }
comparison = "u64/random/1000/s1/select-many/none"
group = "u64/random/select-many/none"

# No comparison field means the plan must be rejected before generation.
[[operations]]
operation = { kind = "segments", segment_len = 0 }
[[operations]]
operation = { kind = "top-k", k = 1001 }
[[operations]]
operation = { kind = "prefix", prefix_len = -1 }
[[operations]]
operation = { kind = "select", index = 1000 }
[[operations]]
operation = { kind = "select-many", indices = [0, 1000] }
[[operations]]
operation = { kind = "rank-range", start = 9, end = 8 }
[[operations]]
operation = { kind = "argsort", unexpected = true }

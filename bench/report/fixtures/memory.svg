<title id="t">Tessera sorts 10,000,000 u64 keys in at most 405 kB of extra memory</title>
<desc id="d">Peak heap allocation during one sort, beyond the 80 MB input. Worst: Tessera 405 kB; glidesort-sqrt 405 kB; slice::sort 80 MB; radsort 80 MB; long-stable-variant-name 80 MB; slice::sort_unstable 0; vqsort 0</desc>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 484" width="720" height="484" role="img" aria-labelledby="t d">
<title id="t">Extra memory for 10,000,000 u64 keys</title>
<desc id="d">405 kB Tessera at most, 405 kB on random input. Tessera: 405 kB; glidesort-sqrt: 405 kB; slice::sort: 80 MB; radsort: 80 MB; long-stable-variant-name: 80 MB; slice::sort_unstable: none; vqsort: none</desc>
<style>

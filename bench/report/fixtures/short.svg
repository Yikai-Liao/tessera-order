<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 622" width="720" height="622" role="img" aria-labelledby="t d">
<title id="t">Tessera is fastest on 0 of 10 input patterns, top 3 on 10</title>
<desc id="d">1,000 u64 keys; each dot is one sort, placed by its speed relative to slice::sort. Speed, Rank: random 2.6×, 2nd; 256 values 2.6×, 2nd; 16 values 2.6×, 2nd; Zipf 1.1 2.6×, 2nd; Zipf 2 2.6×, 2nd; 99% one key 2.6×, 2nd; sorted 2.6×, 2nd; reverse 2.6×, 3rd; 99% sorted 2.6×, 2nd; sorted runs 2.6×, 2nd</desc>

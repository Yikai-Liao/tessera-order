<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 662" width="720" height="662" role="img" aria-labelledby="t d">
<title id="t">Short arrays, 1,000 u64 keys</title>
<desc id="d">0 of 10 inputs faster than every other sort, slower on 10 · even on 0. random: 1.08× slower (vs vqsort); 256 values: 1.08× slower (vs vqsort); 16 values: 1.08× slower (vs vqsort); Zipf 1.1: 1.08× slower (vs vqsort); Zipf 2: 1.08× slower (vs vqsort); 99% one key: 1.08× slower (vs vqsort); sorted: 1.08× slower (vs vqsort); reverse: 1.4× slower (vs radsort); 99% sorted: 1.08× slower (vs vqsort); sorted runs: 1.08× slower (vs vqsort)</desc>
<style>
  .panel { fill: #fafaf8; stroke: #d8d7d2; } .ring { stroke: #fafaf8; }

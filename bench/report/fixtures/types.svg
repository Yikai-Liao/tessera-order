<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 484" width="720" height="484" role="img" aria-labelledby="t d">
<title id="t">Tessera is fastest on 5 of 7 element types, top 3 on 7</title>
<desc id="d">1,000,000 elements; speed relative to slice::sort, geometric mean over 10 input patterns. Speed, Rank: u32 2.6×, 2nd; u64 2.6×, 2nd; f64 2.6×, 1st; {u32, u32} 2.6×, 1st; {u64, u32} 2.6×, 1st; 128-byte record 2.6×, 1st; owned record 2.6×, 1st</desc>

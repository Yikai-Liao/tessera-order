[package]
name = "tessera-bench"
version = "0.0.0"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
rayon = ["tessera-sort/rayon"]

[dev-dependencies]
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }
tessera-sort = { path = "../../rust/tessera-sort" }
rayon = "1.12"

[[bench]]
name = "smoke"
harness = false

[[bench]]
name = "parallel"
harness = false
required-features = ["rayon"]

[lints]
workspace = true

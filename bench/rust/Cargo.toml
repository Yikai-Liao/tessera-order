[package]
name = "tessera-bench"
version = "0.0.0"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
layout-study = []
rayon = ["tessera-sort/rayon", "dep:rayon"]
# Competitor pools do not require Tessera's optional parallel API.
compare = ["dep:rayon", "dep:radsort", "dep:rdst", "dep:glidesort", "dep:voracious_radix_sort", "dep:sha2", "dep:fs2"]
compare-native = ["compare"]

[dependencies]
rayon = { version = "1.12", optional = true }
tessera-sort = { path = "../../rust/tessera-sort" }
radsort = { version = "=0.1.1", optional = true }
rdst = { version = "=0.20.14", default-features = false, optional = true }
glidesort = { version = "=0.1.2", optional = true }
voracious_radix_sort = { version = "=1.2.0", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "1.2", default-features = false, features = ["parse", "serde", "std"] }
sha2 = { version = "=0.10.9", optional = true }
fs2 = { version = "=0.4.3", optional = true }

[build-dependencies]
serde_json = "1"
sha2 = "=0.10.9"

[[bin]]
name = "compare"
required-features = ["compare"]

[[bin]]
name = "memory"
required-features = ["compare"]

[dev-dependencies]
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "smoke"
harness = false

[[bench]]
name = "tracking"
harness = false
required-features = ["compare"]

[lints]
workspace = true

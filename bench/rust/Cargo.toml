[package]
name = "tessera-bench"
version = "0.0.0"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
layout-study = []
# Tessera's optional parallel API; opponent pools use rayon unconditionally.
rayon = ["tessera-sort/rayon"]
compare-native = []

[dependencies]
rayon = "1.12"
tessera-sort = { path = "../../rust/tessera-sort" }
radsort = "=0.1.1"
rdst = { version = "=0.20.14", default-features = false }
glidesort = "=0.1.2"
voracious_radix_sort = "=1.2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "1.2", default-features = false, features = ["parse", "serde", "std"] }
sha2 = "=0.10.9"
fs2 = "=0.4.3"

[build-dependencies]
serde_json = "1"
sha2 = "=0.10.9"

[[bin]]
name = "compare"

[[bin]]
name = "memory"

[dev-dependencies]
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "smoke"
harness = false

[lints]
workspace = true

[package]
name = "tessera-bench"
version = "0.0.0"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
layout-study = []
# Tessera's optional parallel API; opponent pools use rayon unconditionally.
rayon = ["tessera-order/rayon"]
compare-native = []
# Current serial operation adapters; historical full-sort builds leave this off.
operations = []
collections = ["dep:fearless_simd", "dep:blart", "dep:indexset", "dep:index-db"]
# Parallel operation adapters beyond full sorting; left off for pre-par_argsort revisions.
parallel-operations = ["operations", "rayon"]

[dependencies]
fearless_simd = { version = "1.2", optional = true }
blart = { version = "=0.6.0", optional = true }
indexset = { version = "=0.18.0", optional = true }
index-db = { version = "=1.0.1", optional = true }
rayon = "1.12"
tessera-order = { path = "../../rust/tessera-order" }
radsort = "=0.1.1"
rdst = { version = "=0.20.14", default-features = false }
glidesort = "=0.1.2"
voracious_radix_sort = "=1.2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "1.2", default-features = false, features = ["parse", "serde", "std"] }
sha2 = "=0.10.9"
fs2 = "=0.4.3"

[build-dependencies]
serde_json = "1"
sha2 = "=0.10.9"

[[bin]]
name = "compare"

[[bin]]
name = "memory"

[dev-dependencies]
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }

# Built only by explicit `--bench smoke` with its plan's features (see `bench/workspace.ts`);
# a featureless `--all-targets` build cannot run the continuous plan's parallel executions.
[[bench]]
name = "smoke"
harness = false
bench = false

[lints]
workspace = true

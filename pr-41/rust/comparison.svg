<title id="t">Benchmark changes against main: Default 3 faster; Portable SIMD 3 slower · 2 faster</title>
<desc id="d">u128 · random · 1,000,000: Default +0.1%, Portable SIMD +7.3% regression; {u64,u32} · random · 1,000,000: Default −0.2%, Portable SIMD +7.0% regression; rec128_u64 · random · 65,536: Default +1.4%, Portable SIMD +5.4% regression; u64 · reverse · 65,536: Default −30.5% improvement, Portable SIMD −38.5% improvement; u64 · sorted · 65,536: Default −10.5% improvement, Portable SIMD +2.4%; u64 · random · 48: Default +0.0%, Portable SIMD −7.8% improvement; f64 · sorted · 65,536: Default −6.3% improvement, Portable SIMD +0.5%</desc>

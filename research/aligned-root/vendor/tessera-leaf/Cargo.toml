[package]
name = "tessera-consumer-wait"
# Unreleased. Publication waits for the benchmark runner and release report.
version = "0.0.0"
publish = false
description = "Stable radix sort with O(sqrt(n)) auxiliary memory"
readme = "README.md"
keywords = ["sort", "radix-sort", "stable-sort", "sorting", "algorithm"]
categories = ["algorithms"]
edition = "2024"
rust-version = "1.85"
license = "BSD-2-Clause"
repository = "https://github.com/Yikai-Liao/tessera-sort"
authors = ["Yikai Liao <lyk-boya@outlook.com>"]

[features]
default = ["std"]
# Catch a key-function panic, move every record back into the caller's slice and
# resume the panic. Without this feature the crate is `no_std`: it uses `core` and
# `alloc`, needs a global allocator, and aborts on a panic during block partitioning.
std = []
# Optional parallel API; sequential builds keep their dependency-free no_std path.
rayon = ["std", "dep:rayon"]

[dependencies]
rayon = { version = "1.10", optional = true }

[package.metadata.docs.rs]
all-features = true

[workspace]

[lib]
name = "tessera_sort"

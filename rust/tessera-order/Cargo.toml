[package]
name = "tessera-order"
# Unreleased. Publication waits for the benchmark runner and release report.
version = "0.0.0"
publish = false
description = "Order algorithms on stable block partitions; 0.1 provides stable radix sort with O(sqrt(n)) auxiliary memory"
readme = "README.md"
keywords = ["sort", "radix-sort", "stable-sort", "sorting", "algorithm"]
categories = ["algorithms"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# Rayon entry points. Large roots scatter across disjoint shards and sort
# completed buckets in the caller's pool.
rayon = ["dep:rayon"]
# Internal and unstable: records block-partition steps for the documentation
# figures (`rust/tessera-trace`). Not covered by semantic versioning.
trace = []

[dependencies]
fearless_simd = "1.2"
rayon = { version = "1.12", optional = true }

[package.metadata.docs.rs]
# `trace` is internal (documentation figures only), so docs.rs builds the public features.
features = ["rayon"]

[lints]
workspace = true

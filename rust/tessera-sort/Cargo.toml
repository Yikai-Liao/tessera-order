[package]
name = "tessera-sort"
# Unreleased. Publication waits for the benchmark runner and release report.
version = "0.0.0"
publish = false
description = "Stable radix sort with O(sqrt(n)) auxiliary memory"
readme = "README.md"
keywords = ["sort", "radix-sort", "stable-sort", "sorting", "algorithm"]
categories = ["algorithms"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["rayon"]
# Rayon entry points. Large roots scatter across disjoint shards and sort
# completed buckets in the caller pool.
rayon = ["dep:rayon"]

[dependencies]
fearless_simd = "1.2"
rayon = { version = "1.12", optional = true }

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true

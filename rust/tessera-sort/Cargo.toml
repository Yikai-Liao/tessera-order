[package]
name = "tessera-sort"
# Unreleased. Publication waits for the benchmark runner and release report.
version = "0.0.0"
publish = false
description = "Stable radix sort with O(sqrt(n)) auxiliary memory"
readme = "README.md"
keywords = ["sort", "radix-sort", "stable-sort", "sorting", "algorithm"]
categories = ["algorithms"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["std"]
# Catch a key-function panic, move every record back into the caller's slice and
# resume the panic. Without this feature the crate is `no_std`: it uses `core` and
# `alloc`, needs a global allocator, and aborts on a panic during block partitioning.
std = []
# Vector scans and prefix sums through `fearless_simd`. Requires std and Rust
# 1.89. Dispatches at run time on x86; other targets use their baseline ISA.
portable-simd = ["std", "dep:fearless_simd"]
# Rayon entry points. Large inputs sort complete root buckets in the caller's
# pool; the root partition remains serial. Requires std, including without defaults.
rayon = ["std", "dep:rayon"]

[dependencies]
fearless_simd = { version = "1.2", optional = true }
rayon = { version = "1.12", optional = true }

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true

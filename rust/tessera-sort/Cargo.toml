[package]
name = "tessera-sort"
# Unreleased. Publication waits for the benchmark runner and release report.
version = "0.0.0"
publish = false
description = "Stable radix sort with O(sqrt(n)) auxiliary memory"
readme = "README.md"
keywords = ["sort", "radix-sort", "stable-sort", "sorting", "algorithm"]
categories = ["algorithms"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["std"]
# Catch a key-function panic, move every record back into the caller's slice and
# resume the panic. Without this feature the crate is `no_std`: it uses `core` and
# `alloc`, needs a global allocator, and aborts on a panic during block partitioning.
std = []
# Portable vector scans through `fearless_simd`, which picks SSE2, AVX2,
# AVX-512, Arm Neon or WebAssembly SIMD at run time for the machine that runs
# the binary. Off by default: it adds a dependency, one dispatch per insertion
# pass, and a higher minimum Rust version than the rest of the crate.
portable-simd = ["std", "dep:fearless_simd"]

[dependencies]
fearless_simd = { version = "1.2", optional = true }

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
